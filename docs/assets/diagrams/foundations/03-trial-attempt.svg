<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sample、Trial 与 Attempt 的层级</title><desc id="desc">一个 Sample 对每个 Target 和重复序号形成 Trial，基础设施恢复只在 Trial 内新增 Attempt。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:29px;font-weight:700}.t{font-size:21px}.s{font-size:17px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#50617a"/></marker></defs>
  <rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" class="h">统计单位不因基础设施恢复而改变</text>
  <rect x="435" y="90" width="330" height="82" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="600" y="128" text-anchor="middle" class="h">Sample：订单金额 100</text><text x="600" y="157" text-anchor="middle" class="s">输入与期望值固定</text>
  <line x1="600" y1="174" x2="600" y2="218" stroke="#50617a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="100" y="225" width="440" height="105" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="320" y="268" text-anchor="middle" class="h">Trial：buggy · r1</text><text x="320" y="305" text-anchor="middle" class="t">进入统计分母一次</text>
  <rect x="660" y="225" width="440" height="105" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="880" y="268" text-anchor="middle" class="h">Trial：fixed · r1</text><text x="880" y="305" text-anchor="middle" class="t">进入统计分母一次</text>
  <line x1="320" y1="332" x2="320" y2="378" stroke="#50617a" stroke-width="3" marker-end="url(#a)"/><line x1="880" y1="332" x2="880" y2="378" stroke="#50617a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="70" y="385" width="220" height="90" rx="16" fill="#fff" stroke="#d14d4d" stroke-width="3"/><text x="180" y="422" text-anchor="middle" class="t">Attempt 1</text><text x="180" y="452" text-anchor="middle" class="s">基础设施失败</text>
  <rect x="350" y="385" width="220" height="90" rx="16" fill="#fff" stroke="#16966f" stroke-width="3"/><text x="460" y="422" text-anchor="middle" class="t">Attempt 2</text><text x="460" y="452" text-anchor="middle" class="s">canonical</text>
  <rect x="770" y="385" width="220" height="90" rx="16" fill="#fff" stroke="#16966f" stroke-width="3"/><text x="880" y="422" text-anchor="middle" class="t">Attempt 1</text><text x="880" y="452" text-anchor="middle" class="s">canonical</text>
  <line x1="290" y1="430" x2="345" y2="430" stroke="#50617a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="150" y="520" width="900" height="58" rx="29" fill="#14213d"/><text x="600" y="557" text-anchor="middle" class="t" fill="#fff" style="fill:#fff">产品结果失败：保留同一个 canonical Attempt，不创建“再答一次”的机会</text>
</svg>
