<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">从观察到指标的评分边界</title><desc id="desc">确定性 Scorer 和 Judge 都把 Observation 转成 Score，Metric 才对 Score 集合聚合。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:29px;font-weight:700}.t{font-size:20px}.s{font-size:16px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#50617a"/></marker></defs>
  <rect width="1200" height="610" rx="28" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" class="h">Scorer 判断单个 Trial，Metric 描述一组 Trial</text>
  <rect x="55" y="215" width="210" height="105" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="160" y="258" text-anchor="middle" class="t">Observation</text><text x="160" y="288" text-anchor="middle" class="t">Bundle</text>
  <rect x="350" y="105" width="245" height="105" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="473" y="148" text-anchor="middle" class="t">确定性 Scorer</text><text x="473" y="178" text-anchor="middle" class="s">测试、规则、终态断言</text>
  <rect x="350" y="330" width="245" height="125" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="473" y="372" text-anchor="middle" class="t">LLM-as-Judge</text><text x="473" y="402" text-anchor="middle" class="s">Rubric + 校准 + 仲裁</text><text x="473" y="430" text-anchor="middle" class="s">允许 uncertain</text>
  <rect x="690" y="215" width="195" height="105" rx="18" fill="#f1eafe" stroke="#7b53c6" stroke-width="3"/><text x="788" y="258" text-anchor="middle" class="t">ScoreRecord</text><text x="788" y="288" text-anchor="middle" class="s">状态、值、理由、血缘</text>
  <rect x="975" y="215" width="170" height="105" rx="18" fill="#14213d"/><text x="1060" y="258" text-anchor="middle" class="t" style="fill:#fff">Metric</text><text x="1060" y="288" text-anchor="middle" class="s" style="fill:#fff">分母与估计</text>
  <path d="M265 250H315V158H345M265 285H315V392H345M595 158H640V250H685M595 392H640V285H685M885 267H970" fill="none" stroke="#50617a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="165" y="510" width="870" height="55" rx="27" fill="#fff" stroke="#d14d4d" stroke-width="2"/><text x="600" y="545" text-anchor="middle" class="t">缺证据是 unscorable，不应偷偷写成 0；Judge 分歧是 uncertain，不等于失败</text>
</svg>
