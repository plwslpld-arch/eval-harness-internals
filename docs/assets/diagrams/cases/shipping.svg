<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="t d"><title id="t">运费边界评测</title><desc id="d">三个边界样本同时运行旧实现和修复实现，经过字段评分和门禁。</desc><rect width="1100" height="380" rx="26" fill="#f7fafc"/><text x="50" y="58" font-size="28" font-family="Microsoft YaHei,sans-serif" font-weight="700" fill="#18324a">边界前、边界点、边界后必须同时进入计划</text><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#e5f0f8" stroke="#3c7897" stroke-width="2"><rect x="50" y="130" width="180" height="120" rx="18"/><rect x="290" y="95" width="180" height="105" rx="18"/><rect x="290" y="230" width="180" height="105" rx="18"/><rect x="530" y="130" width="180" height="120" rx="18"/><rect x="770" y="130" width="130" height="120" rx="18"/><rect x="960" y="130" width="100" height="120" rx="18"/></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#18324a" font-size="18"><text x="140" y="170" font-weight="700">金额样本</text><text x="140" y="205">99 / 100 / 101</text><text x="380" y="135" font-weight="700">Buggy</text><text x="380" y="168">边界使用 &gt;</text><text x="380" y="270" font-weight="700">Fixed</text><text x="380" y="303">边界使用 ≥</text><text x="620" y="170" font-weight="700">字段 Scorer</text><text x="620" y="205">实际 fee vs 期望</text><text x="835" y="170" font-weight="700">Metric</text><text x="835" y="205">计划分母</text><text x="1010" y="170" font-weight="700">Gate</text><text x="1010" y="205">100%</text></g><g stroke="#526b7d" stroke-width="3"><path d="M230 185L280 145"/><path d="M230 200L280 280"/><path d="M470 145L520 175"/><path d="M470 280L520 210"/><path d="M710 190H760"/><path d="M900 190H950"/></g></svg>
