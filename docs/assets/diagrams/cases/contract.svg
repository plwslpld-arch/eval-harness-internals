<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="t d"><title id="t">合同审查评测</title><desc id="d">合同条款经过结构规则和模型 Judge，并与专家参考及仲裁对照。</desc><rect width="1100" height="400" rx="26" fill="#faf8fc"/><text x="50" y="58" font-size="28" font-family="Microsoft YaHei,sans-serif" font-weight="700" fill="#312143">确定性底线与开放判断分层</text><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#f0e9f7" stroke="#7b58a0" stroke-width="2"><rect x="40" y="140" width="170" height="120" rx="18"/><rect x="260" y="95" width="175" height="100" rx="18"/><rect x="260" y="230" width="175" height="100" rx="18"/><rect x="500" y="140" width="180" height="120" rx="18"/><rect x="745" y="140" width="160" height="120" rx="18"/><rect x="970" y="140" width="90" height="120" rx="18"/></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#312143" font-size="18"><text x="125" y="180" font-weight="700">条款与上下文</text><text x="125" y="215">法域/角色</text><text x="347" y="132" font-weight="700">结构规则</text><text x="347" y="165">关键条款底线</text><text x="347" y="267" font-weight="700">模型 Judge</text><text x="347" y="300">Rubric/多值参考</text><text x="590" y="180" font-weight="700">专家对照</text><text x="590" y="215">双标/分歧/仲裁</text><text x="825" y="180" font-weight="700">Metric</text><text x="825" y="215">关键召回/一致率</text><text x="1015" y="180" font-weight="700">Gate</text><text x="1015" y="215">非补偿</text></g><g stroke="#6d5b7d" stroke-width="3"><path d="M210 195L250 150"/><path d="M210 210L250 275"/><path d="M435 150L490 180"/><path d="M435 280L490 220"/><path d="M680 200H735"/><path d="M905 200H960"/></g></svg>
