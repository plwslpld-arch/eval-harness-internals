<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">知识助手 ACL 评测</title><desc id="d">用户身份先经过访问控制，再进行检索、生成和泄漏评分。</desc><rect width="1100" height="390" rx="26" fill="#f8f9fc"/><text x="50" y="58" font-size="28" font-family="Microsoft YaHei,sans-serif" font-weight="700" fill="#1b2d49">先授权再检索，拒答也要可核对</text><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#e8eefb" stroke="#486aa5" stroke-width="2"><rect x="45" y="130" width="160" height="125" rx="18"/><rect x="255" y="130" width="160" height="125" rx="18"/><rect x="465" y="130" width="160" height="125" rx="18"/><rect x="675" y="130" width="160" height="125" rx="18"/><rect x="885" y="130" width="170" height="125" rx="18"/></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#1b2d49" font-size="18"><text x="125" y="170" font-weight="700">用户与查询</text><text x="125" y="205">角色/租户</text><text x="335" y="170" font-weight="700">ACL 过滤</text><text x="335" y="205">允许文档集合</text><text x="545" y="170" font-weight="700">检索与生成</text><text x="545" y="205">候选/引用</text><text x="755" y="170" font-weight="700">多维 Scorer</text><text x="755" y="205">事实/泄漏/拒答</text><text x="970" y="170" font-weight="700">关键 Gate</text><text x="970" y="205">泄漏次数为零</text></g><g stroke="#53647e" stroke-width="3"><path d="M205 192H245"/><path d="M415 192H455"/><path d="M625 192H665"/><path d="M835 192H875"/></g></svg>
