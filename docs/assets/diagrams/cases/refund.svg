<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="t d"><title id="t">退款 Agent 评测</title><desc id="d">退款请求经过政策决策、工具调用和账本终态验证。</desc><rect width="1100" height="380" rx="26" fill="#f8faf8"/><text x="50" y="58" font-size="28" font-family="Microsoft YaHei,sans-serif" font-weight="700" fill="#17372a">副作用必须由账本终态验证</text><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#e5f5ec" stroke="#39835f" stroke-width="2"><rect x="50" y="130" width="170" height="120" rx="18"/><rect x="275" y="130" width="170" height="120" rx="18"/><rect x="500" y="130" width="170" height="120" rx="18"/><rect x="725" y="130" width="170" height="120" rx="18"/><rect x="950" y="130" width="110" height="120" rx="18"/></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#17372a" font-size="18"><text x="135" y="170" font-weight="700">退款请求</text><text x="135" y="205">金额/审批/交易</text><text x="360" y="170" font-weight="700">Agent 决策</text><text x="360" y="205">退款或升级</text><text x="585" y="170" font-weight="700">工具调用</text><text x="585" y="205">审批/幂等键</text><text x="810" y="170" font-weight="700">账本 Verifier</text><text x="810" y="205">恰好一次/无越权</text><text x="1005" y="170" font-weight="700">Gate</text><text x="1005" y="205">零泄漏</text></g><g stroke="#526f60" stroke-width="3"><path d="M220 190H265"/><path d="M445 190H490"/><path d="M670 190H715"/><path d="M895 190H940"/></g></svg>
