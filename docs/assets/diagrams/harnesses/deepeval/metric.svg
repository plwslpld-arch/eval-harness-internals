<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d"><title id="t">DeepEval Metric 测量与判定</title><desc id="d">测试用例经 Metric 测量产生分数和原因，再由阈值派生成功状态。</desc><rect width="1200" height="450" rx="28" fill="#faf8fc"/><text x="55" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#312044">先测量，再按政策判定</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6c5b7c"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#f0e9f7" stroke="#7d56a1" stroke-width="2"><rect x="55" y="145" width="200" height="135" rx="18"/><rect x="330" y="145" width="200" height="135" rx="18"/><rect x="605" y="145" width="200" height="135" rx="18"/><rect x="880" y="145" width="270" height="135" rx="18"/></g><g fill="#302043" font-size="19"><text x="155" y="185" font-weight="700">LLMTestCase</text><text x="155" y="220">输入/实际输出</text><text x="155" y="248">上下文/工具</text><text x="430" y="185" font-weight="700">measure</text><text x="430" y="220">确定性逻辑</text><text x="430" y="248">或模型 Judge</text><text x="705" y="185" font-weight="700">测量状态</text><text x="705" y="220">score/reason</text><text x="705" y="248">error/cost</text><text x="1015" y="185" font-weight="700">政策判定与证据</text><text x="1015" y="220">threshold → success</text><text x="1015" y="248">MetricData 保留原值</text></g></g><g stroke="#6c5b7c" stroke-width="3" marker-end="url(#a)"><path d="M255 212H320"/><path d="M530 212H595"/><path d="M805 212H870"/></g><rect x="260" y="335" width="680" height="52" rx="13" fill="#fff1d9" stroke="#ca8e27"/><text x="600" y="368" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#5e4315">threshold 改变只应重算判定；Metric 合同改变则需重新测量</text></svg>
