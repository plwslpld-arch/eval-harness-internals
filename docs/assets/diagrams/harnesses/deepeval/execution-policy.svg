<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">DeepEval 异步缓存错误边界</title><desc id="d">并发、缓存和错误策略改变执行但不能改变统计单位。</desc><rect width="1200" height="470" rx="28" fill="#f7fafb"/><text x="55" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#15343d">工程优化不能偷偷改写样本分母</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4c6f77"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#e4f3f4" stroke="#3e7f88" stroke-width="2"><rect x="55" y="165" width="170" height="120" rx="18"/><rect x="300" y="90" width="190" height="100" rx="18"/><rect x="300" y="250" width="190" height="100" rx="18"/><rect x="565" y="165" width="180" height="120" rx="18"/><rect x="820" y="165" width="160" height="120" rx="18"/><rect x="1055" y="165" width="95" height="120" rx="18"/></g><g fill="#14343b" font-size="18"><text x="140" y="205" font-weight="700">固定 Trial</text><text x="140" y="238">样本身份不变</text><text x="395" y="127" font-weight="700">异步调度</text><text x="395" y="158">Semaphore 上限</text><text x="395" y="287" font-weight="700">缓存查找</text><text x="395" y="318">完整 identity key</text><text x="655" y="205" font-weight="700">Target/Metric</text><text x="655" y="238">执行或复用</text><text x="900" y="205" font-weight="700">分层结果</text><text x="900" y="238">pass/fail/error</text><text x="1102" y="205" font-weight="700">Gate</text><text x="1102" y="238">三态</text></g></g><g stroke="#4c6f77" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M225 220C260 220 260 140 290 140"/><path d="M225 230C260 230 260 300 290 300"/><path d="M490 140C530 140 525 195 555 205"/><path d="M490 300C530 300 525 250 555 240"/><path d="M745 225H810"/><path d="M980 225H1045"/></g><rect x="250" y="390" width="700" height="50" rx="13" fill="#fff1d8" stroke="#ca8c25"/><text x="600" y="422" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, sans-serif" fill="#5e4214">忽略错误只允许继续收集；发布分析仍必须报告错误与缺失</text></svg>
