<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">DeepEval 主调用链</title><desc id="d">Golden 或 TestCase 经执行器和 Metric 形成 TestResult 与 TestRun。</desc><rect width="1200" height="430" rx="28" fill="#f7faf8"/><text x="55" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#15382b">DeepEval：测试对象、测量对象与运行记录</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#527061"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#e5f5ec" stroke="#36845f" stroke-width="2"><rect x="50" y="120" width="185" height="130" rx="18"/><rect x="285" y="120" width="185" height="130" rx="18"/><rect x="520" y="120" width="185" height="130" rx="18"/><rect x="755" y="120" width="185" height="130" rx="18"/><rect x="990" y="120" width="160" height="130" rx="18"/></g><g fill="#17372a" font-size="19"><text x="142" y="160" font-weight="700">数据入口</text><text x="142" y="195">Golden</text><text x="142" y="222">或 TestCase</text><text x="377" y="160" font-weight="700">执行入口</text><text x="377" y="195">evaluate</text><text x="377" y="222">assert_test</text><text x="612" y="160" font-weight="700">执行循环</text><text x="612" y="195">同步/异步</text><text x="612" y="222">缓存/错误</text><text x="847" y="160" font-weight="700">Metric</text><text x="847" y="195">分数/原因</text><text x="847" y="222">错误/成本</text><text x="1070" y="160" font-weight="700">运行证据</text><text x="1070" y="195">TestResult</text><text x="1070" y="222">TestRun</text></g></g><g stroke="#527061" stroke-width="3" marker-end="url(#a)"><path d="M235 185H275"/><path d="M470 185H510"/><path d="M705 185H745"/><path d="M940 185H980"/></g><rect x="245" y="315" width="710" height="55" rx="14" fill="#fff2d8" stroke="#c98d27"/><text x="600" y="350" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#5d4315">低分是产品判据失败；测量错误是评测不可得，两者必须分层</text></svg>
