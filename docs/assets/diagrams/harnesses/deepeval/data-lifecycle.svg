<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d"><title id="t">DeepEval 数据对象生命周期</title><desc id="d">Dataset 中的 Golden 经目标执行与运行观测形成 LLMTestCase。</desc><rect width="1200" height="450" rx="28" fill="#f8f9fc"/><text x="55" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#1b2944">参考数据与运行观测不能混写</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53637e"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#e8eefb" stroke="#466aa6" stroke-width="2"><rect x="50" y="145" width="175" height="140" rx="18"/><rect x="285" y="145" width="175" height="140" rx="18"/><rect x="520" y="145" width="175" height="140" rx="18"/><rect x="755" y="145" width="190" height="140" rx="18"/><rect x="1005" y="145" width="145" height="140" rx="18"/></g><g fill="#1c2c4a" font-size="19"><text x="137" y="185" font-weight="700">Dataset</text><text x="137" y="220">版本/来源</text><text x="137" y="248">单轮或多轮</text><text x="372" y="185" font-weight="700">Golden</text><text x="372" y="220">输入/期望</text><text x="372" y="248">预设上下文</text><text x="607" y="185" font-weight="700">Target 执行</text><text x="607" y="220">用户代码</text><text x="607" y="248">trace/span</text><text x="850" y="185" font-weight="700">LLMTestCase</text><text x="850" y="220">实际输出/检索</text><text x="850" y="248">工具/元数据</text><text x="1077" y="185" font-weight="700">Metric</text><text x="1077" y="220">可评分</text><text x="1077" y="248">观察</text></g></g><g stroke="#53637e" stroke-width="3" marker-end="url(#a)"><path d="M225 215H275"/><path d="M460 215H510"/><path d="M695 215H745"/><path d="M945 215H995"/></g><text x="600" y="370" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#52617a">actual_output 属于运行结果；回写到 Golden 会破坏来源边界</text></svg>
