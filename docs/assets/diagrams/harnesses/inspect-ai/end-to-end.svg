<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc"><title id="title">Inspect AI 端到端评测链</title><desc id="desc">eval 和 eval_async 解析 Task，在 Sandbox 中按 Solver Plan 运行 Sample，再由 Scorer 评分并写入 EvalLog。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:28px;font-weight:700}.t{font-size:19px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1300" height="650" rx="28" fill="#f8fafc"/><text x="650" y="50" text-anchor="middle" class="h">Task 把 Dataset、Solver、Scorer 与 Sandbox 组合成一次可记录 Eval</text><g stroke-width="3"><rect x="45" y="120" width="190" height="105" rx="18" fill="#e8f2ff" stroke="#2675d8"/><rect x="285" y="120" width="190" height="105" rx="18" fill="#e9faf4" stroke="#16966f"/><rect x="525" y="120" width="190" height="105" rx="18" fill="#fff2e4" stroke="#ee7b2d"/><rect x="765" y="120" width="190" height="105" rx="18" fill="#f1eafe" stroke="#7b53c6"/><rect x="1005" y="120" width="250" height="105" rx="18" fill="#14213d" stroke="#14213d"/></g><text x="140" y="163" text-anchor="middle" class="t">eval / eval_async</text><text x="140" y="195" text-anchor="middle" class="s">解析模型与 Task</text><text x="380" y="163" text-anchor="middle" class="t">eval_run</text><text x="380" y="195" text-anchor="middle" class="s">准备 TaskRunOptions</text><text x="620" y="163" text-anchor="middle" class="t">task_run</text><text x="620" y="195" text-anchor="middle" class="s">并发 Sample 生命周期</text><text x="860" y="163" text-anchor="middle" class="t">Scorer / Reducer</text><text x="860" y="195" text-anchor="middle" class="s">逐样本评分与跨 epoch</text><text x="1130" y="163" text-anchor="middle" class="t" style="fill:#fff">EvalLog</text><text x="1130" y="195" text-anchor="middle" class="s" style="fill:#fff">Spec · Plan · Sample · Results</text><path d="M235 173H280M475 173H520M715 173H760M955 173H1000" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="330" width="1120" height="190" rx="22" fill="#fff" stroke="#bcc7d8" stroke-width="2"/><text x="125" y="372" class="h">单个 Sample 内部</text><text x="125" y="413" class="t">创建/选择 Sandbox → 复制 files 与 setup → 初始化 TaskState → 依次运行 Solver Plan</text><text x="125" y="452" class="t">模型与工具事件写入样本事件流 → Scorer(state, target) 产生 Score → 保存 usage 与 error</text><text x="125" y="491" class="t">多 epoch 可由 Reducer 合并；Task 级 Metric 记录 scored_samples 与 unscored_samples</text><text x="650" y="585" text-anchor="middle" class="t">Task retry 是整项 Task 调度恢复；Sample error、score_on_error 和 cancel 类型必须分开理解</text></svg>
