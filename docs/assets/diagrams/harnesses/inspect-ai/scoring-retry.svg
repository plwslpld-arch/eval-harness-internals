<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="610" viewBox="0 0 1250 610" role="img" aria-labelledby="title desc"><title id="title">Inspect AI 评分与两层重试</title><desc id="desc">Sample retry 保留 error_retries，Task retry 新建日志并复用已完成 Sample；Scorer 与 Reducer 形成结果。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="610" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">评分事实与恢复历史不能互相覆盖</text><rect x="55" y="120" width="220" height="105" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="165" y="161" text-anchor="middle" class="t">TaskState + Target</text><text x="165" y="194" text-anchor="middle" class="s">Sample 最终可观察状态</text><rect x="350" y="120" width="220" height="105" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="460" y="161" text-anchor="middle" class="t">多个 Scorer</text><text x="460" y="194" text-anchor="middle" class="s">ScoreEvent + SampleScore</text><rect x="645" y="120" width="220" height="105" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="755" y="161" text-anchor="middle" class="t">Epoch Reducer</text><text x="755" y="194" text-anchor="middle" class="s">scored / unscored 分开</text><rect x="940" y="120" width="255" height="105" rx="18" fill="#14213d"/><text x="1068" y="161" text-anchor="middle" class="t" style="fill:#fff">EvalResults / EvalLog</text><text x="1068" y="194" text-anchor="middle" class="s" style="fill:#fff">Spec · Plan · Samples · Error</text><path d="M275 173H345M570 173H640M865 173H935" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="350" width="480" height="145" rx="22" fill="#fff" stroke="#2675d8" stroke-width="2"/><text x="325" y="392" text-anchor="middle" class="t">Sample retry</text><text x="325" y="430" text-anchor="middle" class="s">新 TaskState · error_retries 保留 · 同一计划 Sample</text><text x="325" y="464" text-anchor="middle" class="s">普通 Score failed 不触发</text><rect x="685" y="350" width="480" height="145" rx="22" fill="#fff" stroke="#ee7b2d" stroke-width="2"/><text x="925" y="392" text-anchor="middle" class="t">Task retry</text><text x="925" y="430" text-anchor="middle" class="s">新日志 entry · 复用已完成 SampleSource</text><text x="925" y="464" text-anchor="middle" class="s">失败日志仍是恢复证据</text></svg>
