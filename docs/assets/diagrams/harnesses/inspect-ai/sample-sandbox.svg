<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="610" viewBox="0 0 1250 610" role="img" aria-labelledby="title desc"><title id="title">Inspect AI Sample 与 Sandbox 生命周期</title><desc id="desc">Sample 创建 TaskState，进入 Sandbox，运行 Solver，执行 Scorer 和 cleanup，最后形成 EvalSample。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="610" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">一次 Sample：环境事实与模型输出在评分前汇合</text><rect x="50" y="130" width="185" height="100" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="143" y="170" text-anchor="middle" class="t">创建 TaskState</text><text x="143" y="201" text-anchor="middle" class="s">输入 · Target · epoch</text><rect x="285" y="130" width="185" height="100" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="378" y="170" text-anchor="middle" class="t">进入 Sandbox</text><text x="378" y="201" text-anchor="middle" class="s">files · setup · 限制</text><rect x="520" y="130" width="185" height="100" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="613" y="170" text-anchor="middle" class="t">运行 Solver Plan</text><text x="613" y="201" text-anchor="middle" class="s">模型 · 工具 · 事件</text><rect x="755" y="130" width="185" height="100" rx="18" fill="#f1eafe" stroke="#7b53c6" stroke-width="3"/><text x="848" y="170" text-anchor="middle" class="t">Scorer 与 cleanup</text><text x="848" y="201" text-anchor="middle" class="s">终态仍可访问</text><rect x="990" y="130" width="210" height="100" rx="18" fill="#14213d"/><text x="1095" y="170" text-anchor="middle" class="t" style="fill:#fff">EvalSample</text><text x="1095" y="201" text-anchor="middle" class="s" style="fill:#fff">事件 · Score · usage · error</text><path d="M235 180H280M470 180H515M705 180H750M940 180H985" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="130" y="360" width="990" height="135" rx="22" fill="#fff" stroke="#d14d4d" stroke-width="2"/><text x="625" y="402" text-anchor="middle" class="t">Sample error → 先消费 retry_on_error → 重建新 TaskState</text><text x="625" y="440" text-anchor="middle" class="t">预算耗尽且 score_on_error=true → 保留 error，同时允许 Scorer 读取部分状态</text><text x="625" y="477" text-anchor="middle" class="s">产品 Score 失败不等于异常；Sandbox 创建失败也不等于产品零分</text></svg>
