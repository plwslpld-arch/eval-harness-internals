<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Promptfoo 从配置到结果的主调用链</title><desc id="desc">配置展开为原子步骤，经 Provider 调用和断言判分后写入结果与汇总。</desc>
<rect width="1200" height="420" rx="28" fill="#f7f8fc"/><text x="60" y="65" font-size="30" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#18223b">Promptfoo：配置矩阵不是一条请求</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#e7efff" stroke="#3565b5" stroke-width="2"><rect x="55" y="135" width="170" height="130" rx="18"/><rect x="285" y="135" width="170" height="130" rx="18"/><rect x="515" y="135" width="170" height="130" rx="18"/><rect x="745" y="135" width="170" height="130" rx="18"/><rect x="975" y="135" width="170" height="130" rx="18"/></g><g fill="#16233e" font-size="22" font-weight="700"><text x="140" y="180">配置集合</text><text x="370" y="180">展开计划</text><text x="600" y="180">目标调用</text><text x="830" y="180">断言判分</text><text x="1060" y="180">结果汇总</text></g><g fill="#40506c" font-size="17"><text x="140" y="216">提示词/模型</text><text x="140" y="242">测试/变量</text><text x="370" y="216">原子步骤</text><text x="370" y="242">串并行约束</text><text x="600" y="216">ProviderResponse</text><text x="600" y="242">错误/用量/延迟</text><text x="830" y="216">通过/得分/原因</text><text x="830" y="242">组件指标</text><text x="1060" y="216">结果行/JSONL</text><text x="1060" y="242">CI 消费</text></g></g>
<g stroke="#52627a" stroke-width="3" marker-end="url(#a)"><path d="M225 200H275"/><path d="M455 200H505"/><path d="M685 200H735"/><path d="M915 200H965"/></g><rect x="285" y="315" width="630" height="55" rx="14" fill="#fff3d6" stroke="#d19a20"/><text x="600" y="350" text-anchor="middle" font-size="20" font-family="Microsoft YaHei, sans-serif" fill="#5c4312">每一层都保留身份与失败原因，汇总不能替代行级证据</text>
</svg>
