<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Promptfoo Provider 解析与矩阵生成</title><desc id="desc">多种 Provider 输入先归一化，再与提示词、测试和变量组合。</desc><rect width="1200" height="430" rx="28" fill="#f8faf8"/><text x="55" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#18352a">先归一化身份，再展开运行坐标</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#527060"/></marker></defs><g font-family="Microsoft YaHei, sans-serif"><g fill="#e5f5ec" stroke="#36845f" stroke-width="2"><rect x="55" y="110" width="210" height="52" rx="14"/><rect x="55" y="178" width="210" height="52" rx="14"/><rect x="55" y="246" width="210" height="52" rx="14"/><rect x="55" y="314" width="210" height="52" rx="14"/><rect x="370" y="174" width="220" height="128" rx="18"/><rect x="700" y="174" width="180" height="128" rx="18"/><rect x="990" y="174" width="155" height="128" rx="18"/></g><g fill="#17372a" font-size="19" text-anchor="middle"><text x="160" y="143">短名或配置对象</text><text x="160" y="211">调用函数</text><text x="160" y="279">模块文件</text><text x="160" y="347">已构造 Provider</text><text x="480" y="215" font-weight="700">ApiProvider</text><text x="480" y="248">id + callApi</text><text x="480" y="276">配置与转换</text><text x="790" y="214" font-weight="700">配置矩阵</text><text x="790" y="246">测试 × 变量</text><text x="790" y="275">提示词 × Provider</text><text x="1067" y="215" font-weight="700">运行步骤</text><text x="1067" y="247">稳定坐标</text><text x="1067" y="275">具体上下文</text></g></g><g stroke="#527060" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M265 136C330 136 320 200 360 210"/><path d="M265 204H360"/><path d="M265 272C320 272 320 250 360 245"/><path d="M265 340C330 340 320 286 360 276"/><path d="M590 238H690"/><path d="M880 238H980"/></g><text x="610" y="390" text-anchor="middle" font-size="19" font-family="Microsoft YaHei, sans-serif" fill="#526354">展示标签可重复；复现必须保存解析后的身份、配置摘要与输入摘要</text></svg>
