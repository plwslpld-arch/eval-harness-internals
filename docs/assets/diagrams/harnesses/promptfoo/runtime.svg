<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc"><title id="title">Promptfoo 原子测试运行与持久化</title><desc id="desc">运行计划根据状态依赖选择串行或并发，结果写入 Store 和 JSONL。</desc><rect width="1200" height="450" rx="28" fill="#f9f8fc"/><text x="60" y="60" font-size="29" font-family="Microsoft YaHei, sans-serif" font-weight="700" fill="#2a2142">调度首先保护语义，其次才追求吞吐</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#675979"/></marker></defs><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#eee8f7" stroke="#76529d" stroke-width="2"><rect x="55" y="170" width="170" height="100" rx="18"/><rect x="300" y="145" width="195" height="150" rx="18"/><rect x="570" y="100" width="190" height="105" rx="18"/><rect x="570" y="245" width="190" height="105" rx="18"/><rect x="835" y="145" width="145" height="150" rx="18"/><rect x="1040" y="145" width="110" height="150" rx="18"/></g><g fill="#2b2040" font-size="19"><text x="140" y="210" font-weight="700">运行计划</text><text x="140" y="240">原子步骤</text><text x="397" y="185" font-weight="700">依赖检查</text><text x="397" y="220">会话/跨步输出</text><text x="397" y="250">持久浏览器状态</text><text x="665" y="140" font-weight="700">受限并发</text><text x="665" y="174">无共享状态</text><text x="665" y="285" font-weight="700">顺序执行</text><text x="665" y="319">存在状态依赖</text><text x="907" y="185" font-weight="700">runEval</text><text x="907" y="220">超时/中断</text><text x="907" y="250">响应/评分</text><text x="1095" y="185" font-weight="700">Store</text><text x="1095" y="220">JSONL</text><text x="1095" y="250">恢复副本</text></g></g><g stroke="#675979" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M225 220H290"/><path d="M495 200C530 200 530 150 560 150"/><path d="M495 240C530 240 530 295 560 295"/><path d="M760 152C800 152 800 190 825 200"/><path d="M760 297C800 297 800 250 825 240"/><path d="M980 220H1030"/></g><rect x="300" y="380" width="680" height="44" rx="12" fill="#fff1da" stroke="#ce8a22"/><text x="640" y="409" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, sans-serif" fill="#60420f">数据库失败后保留权威行，是恢复能力，不是恰好一次执行证明</text></svg>
