<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600" role="img" aria-labelledby="title desc"><title id="title">Instance 请求执行与回填</title><desc id="desc">Task 产生不同 request_type 的 Instance，evaluate 分桶、复制 repeats、调用 LM 方法并回填响应。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:19px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="600" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">Request 不等于 Sample：一个文档可拆成多个 Instance</text><rect x="55" y="115" width="230" height="100" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="170" y="157" text-anchor="middle" class="t">Task 文档</text><text x="170" y="188" text-anchor="middle" class="s">doc_id = 42</text><rect x="355" y="90" width="240" height="95" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="475" y="129" text-anchor="middle" class="t">Instance idx=0</text><text x="475" y="158" text-anchor="middle" class="s">loglikelihood 选项 A</text><rect x="355" y="230" width="240" height="95" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="475" y="269" text-anchor="middle" class="t">Instance idx=1</text><text x="475" y="298" text-anchor="middle" class="s">loglikelihood 选项 B</text><rect x="690" y="145" width="230" height="120" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="805" y="188" text-anchor="middle" class="t">按 request_type 分桶</text><text x="805" y="220" text-anchor="middle" class="s">复制 repeats / 分布式补齐</text><rect x="1010" y="145" width="190" height="120" rx="18" fill="#f1eafe" stroke="#7b53c6" stroke-width="3"/><text x="1105" y="188" text-anchor="middle" class="t">LM.loglikelihood</text><text x="1105" y="220" text-anchor="middle" class="s">批量返回响应</text><path d="M285 160H350M285 180H330V277H350M595 137H645V188H685M595 277H645V222H685M920 205H1005" fill="none" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="130" y="410" width="990" height="110" rx="20" fill="#fff" stroke="#14213d" stroke-width="2"/><text x="625" y="452" text-anchor="middle" class="t">响应按 zip 顺序追加到 Instance.resps → Filter 写入 filtered_resps</text><text x="625" y="490" text-anchor="middle" class="t">再按 doc_id 分组、idx 排序 → Task.process_results(doc, [A响应, B响应])</text></svg>
