<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="610" viewBox="0 0 1250 610" role="img" aria-labelledby="title desc"><title id="title">样本 metric 到任务与组聚合</title><desc id="desc">process_results 产生逐样本值，任务聚合函数计算 metric 与标准误，Group 自底向上聚合。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:19px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="610" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">逐样本 metric 先在 Task 内聚合，再进入 Group</text><rect x="55" y="125" width="240" height="115" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="175" y="168" text-anchor="middle" class="t">process_results</text><text x="175" y="200" text-anchor="middle" class="s">doc + filtered responses</text><rect x="365" y="125" width="240" height="115" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="485" y="168" text-anchor="middle" class="t">raw_metrics</text><text x="485" y="200" text-anchor="middle" class="s">(metric, filter) → values</text><rect x="675" y="125" width="250" height="115" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="800" y="168" text-anchor="middle" class="t">Task aggregation()</text><text x="800" y="200" text-anchor="middle" class="s">聚合值 + Bootstrap stderr</text><rect x="995" y="125" width="205" height="115" rx="18" fill="#f1eafe" stroke="#7b53c6" stroke-width="3"/><text x="1098" y="168" text-anchor="middle" class="t">Group.aggregate</text><text x="1098" y="200" text-anchor="middle" class="s">子节点先于父节点</text><path d="M295 182H360M605 182H670M925 182H990" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="110" y="360" width="1030" height="140" rx="22" fill="#fff" stroke="#bcc7d8" stroke-width="2"/><text x="145" y="404" class="h">报告同时保存</text><text x="145" y="445" class="t">Task 配置、版本、num_fewshot、higher_is_better、原始/有效样本数、可选 logged_samples</text><text x="145" y="480" class="t">源码中 sample_len 当前取最后一个 metric 的 items 长度；不同 metric 缺失时需要特别核对分母</text><text x="625" y="560" text-anchor="middle" class="s">Fallback mean 是实现便利，不代表任意自定义 metric 的正确聚合语义</text></svg>
