<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-labelledby="title desc"><title id="title">lm-evaluation-harness 端到端调用链</title><desc id="desc">simple_evaluate 装配模型与任务，evaluate 构造 Instance、批量执行请求、处理样本结果并聚合。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:28px;font-weight:700}.t{font-size:19px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1300" height="630" rx="28" fill="#f8fafc"/><text x="650" y="50" text-anchor="middle" class="h">从命令参数到任务指标：两层入口、四段数据变形</text><g stroke-width="3"><rect x="45" y="120" width="180" height="100" rx="18" fill="#e8f2ff" stroke="#2675d8"/><rect x="280" y="120" width="180" height="100" rx="18" fill="#e9faf4" stroke="#16966f"/><rect x="515" y="120" width="180" height="100" rx="18" fill="#fff2e4" stroke="#ee7b2d"/><rect x="750" y="120" width="180" height="100" rx="18" fill="#f1eafe" stroke="#7b53c6"/><rect x="985" y="120" width="270" height="100" rx="18" fill="#14213d" stroke="#14213d"/></g><text x="135" y="162" text-anchor="middle" class="t">simple_evaluate</text><text x="135" y="193" text-anchor="middle" class="s">模型 / Task 装配</text><text x="370" y="162" text-anchor="middle" class="t">build_all_requests</text><text x="370" y="193" text-anchor="middle" class="s">文档 → Instance</text><text x="605" y="162" text-anchor="middle" class="t">LM 方法批处理</text><text x="605" y="193" text-anchor="middle" class="s">request_type 分桶</text><text x="840" y="162" text-anchor="middle" class="t">process_results</text><text x="840" y="193" text-anchor="middle" class="s">响应 → 样本值</text><text x="1120" y="162" text-anchor="middle" class="t" style="fill:#fff">_process_results</text><text x="1120" y="193" text-anchor="middle" class="s" style="fill:#fff">Task / Group 聚合与 stderr</text><path d="M225 170H275M460 170H510M695 170H745M930 170H980" stroke="#53627b" marker-end="url(#a)"/><rect x="90" y="330" width="1120" height="180" rx="22" fill="#fff" stroke="#bcc7d8" stroke-width="2"/><text x="120" y="370" class="h">核心中间对象：Instance</text><text x="120" y="413" class="t">request_type 决定调用 LM.loglikelihood / loglikelihood_rolling / generate_until</text><text x="120" y="452" class="t">doc_id + idx 把多个请求重新组回原样本；repeats 控制同一请求的多次响应</text><text x="120" y="491" class="t">resps 保存原始响应，filtered_resps 保存过滤后交给 Task.process_results 的值</text><text x="650" y="575" text-anchor="middle" class="t">Task 同时负责“把文档变成请求”和“把响应变成样本 metric”；Model Adapter 只负责请求类型</text></svg>
