<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600" role="img" aria-labelledby="title desc"><title id="title">OpenAI Evals Registry 解析</title><desc id="desc">Registry 从多个路径加载 YAML 资源，去重、解引用并实例化 Eval 与 CompletionFn。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="600" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">配置键不是对象身份：Registry 还要加载、解引用和实例化</text><rect x="60" y="120" width="230" height="120" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="175" y="160" text-anchor="middle" class="t">registry_paths</text><text x="175" y="193" text-anchor="middle" class="s">evals / completion_fns</text><text x="175" y="219" text-anchor="middle" class="s">solvers / modelgraded</text><rect x="370" y="120" width="230" height="120" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="485" y="160" text-anchor="middle" class="t">_load_registry</text><text x="485" y="193" text-anchor="middle" class="s">重复 key 直接拒绝</text><text x="485" y="219" text-anchor="middle" class="s">保存 registry_path</text><rect x="680" y="120" width="230" height="120" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="795" y="160" text-anchor="middle" class="t">_dereference</text><text x="795" y="193" text-anchor="middle" class="s">EvalSpec / CompletionFnSpec</text><text x="795" y="219" text-anchor="middle" class="s">合并 args</text><rect x="990" y="120" width="205" height="120" rx="18" fill="#14213d"/><text x="1093" y="160" text-anchor="middle" class="t" style="fill:#fff">实例化</text><text x="1093" y="193" text-anchor="middle" class="s" style="fill:#fff">Eval class</text><text x="1093" y="219" text-anchor="middle" class="s" style="fill:#fff">CompletionFn / Solver</text><path d="M290 180H365M600 180H675M910 180H985" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="175" y="375" width="900" height="105" rx="20" fill="#fff" stroke="#d14d4d" stroke-width="2"/><text x="625" y="417" text-anchor="middle" class="t">同名模型字符串可能走 OpenAI API 快捷分支，也可能命中 Registry 资源</text><text x="625" y="454" text-anchor="middle" class="s">要复现运行，需保存 Registry 内容版本、路径优先级、最终 spec 和 completion_args</text></svg>
