<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">OpenAI Evals 配置驱动调用链</title><desc id="desc">oaieval 从 Registry 解析 EvalSpec 和 CompletionFn，创建 Eval 与 Recorder，运行样本并写最终报告。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1280" height="620" rx="28" fill="#f8fafc"/><text x="640" y="50" text-anchor="middle" class="h">Registry 把字符串配置解析成 Eval、CompletionFn 与数据路径</text><rect x="40" y="120" width="190" height="105" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="135" y="162" text-anchor="middle" class="t">oaieval.run</text><text x="135" y="194" text-anchor="middle" class="s">CLI 参数</text><rect x="275" y="120" width="210" height="105" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="380" y="162" text-anchor="middle" class="t">Registry</text><text x="380" y="194" text-anchor="middle" class="s">EvalSpec / CompletionFnSpec</text><rect x="530" y="120" width="200" height="105" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="630" y="162" text-anchor="middle" class="t">Eval.run</text><text x="630" y="194" text-anchor="middle" class="s">遍历样本</text><rect x="775" y="120" width="205" height="105" rx="18" fill="#f1eafe" stroke="#7b53c6" stroke-width="3"/><text x="878" y="162" text-anchor="middle" class="t">CompletionFn</text><text x="878" y="194" text-anchor="middle" class="s">模型或 Solver</text><rect x="1025" y="120" width="215" height="105" rx="18" fill="#14213d"/><text x="1133" y="162" text-anchor="middle" class="t" style="fill:#fff">Recorder</text><text x="1133" y="194" text-anchor="middle" class="s" style="fill:#fff">事件 JSONL + final_report</text><path d="M230 173H270M485 173H525M730 173H770M980 173H1020" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="355" width="1040" height="145" rx="22" fill="#fff" stroke="#bcc7d8" stroke-width="2"/><text x="640" y="397" text-anchor="middle" class="t">每个 sample：as_default_recorder(sample_id) → 调 CompletionFn → record_sampling / match / metrics / error</text><text x="640" y="438" text-anchor="middle" class="t">Eval.run 返回 dict → Recorder.record_final_report</text><text x="640" y="477" text-anchor="middle" class="s">事件丰富不等于 Trial/Attempt 状态完整；Registry 路径和解析后参数必须一起保存</text></svg>
