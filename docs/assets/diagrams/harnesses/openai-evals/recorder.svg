<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="600" viewBox="0 0 1250 600" role="img" aria-labelledby="title desc"><title id="title">OpenAI Evals Recorder 事件模型</title><desc id="desc">Sample 上下文把 sampling、match、function_call、metrics 和 error 事件与 sample_id 绑定，最后另写 final report。</desc><defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#14213d}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#53627b"/></marker></defs><rect width="1250" height="600" rx="28" fill="#f8fafc"/><text x="625" y="50" text-anchor="middle" class="h">Recorder 记录事件，但不会自动建立完整质量推断</text><rect x="55" y="120" width="220" height="110" rx="18" fill="#e8f2ff" stroke="#2675d8" stroke-width="3"/><text x="165" y="163" text-anchor="middle" class="t">Sample Context</text><text x="165" y="196" text-anchor="middle" class="s">sample_id</text><rect x="345" y="90" width="235" height="170" rx="18" fill="#e9faf4" stroke="#16966f" stroke-width="3"/><text x="463" y="128" text-anchor="middle" class="t">record_event</text><text x="463" y="161" text-anchor="middle" class="s">sampling · match</text><text x="463" y="189" text-anchor="middle" class="s">function_call · cond_logp</text><text x="463" y="217" text-anchor="middle" class="s">metrics · error · extra</text><rect x="650" y="120" width="235" height="110" rx="18" fill="#fff2e4" stroke="#ee7b2d" stroke-width="3"/><text x="768" y="163" text-anchor="middle" class="t">Local / HTTP / DB</text><text x="768" y="196" text-anchor="middle" class="s">HTTP 失败可回落本地</text><rect x="955" y="120" width="240" height="110" rx="18" fill="#14213d"/><text x="1075" y="163" text-anchor="middle" class="t" style="fill:#fff">Final Report</text><text x="1075" y="196" text-anchor="middle" class="s" style="fill:#fff">Eval.run 返回聚合字典</text><path d="M275 175H340M580 175H645M885 175H950" stroke="#53627b" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="375" width="1010" height="105" rx="20" fill="#fff" stroke="#7b53c6" stroke-width="2"/><text x="625" y="417" text-anchor="middle" class="t">事件可反查 prompt / sampled / expected / picked，却未强制 canonical Attempt 与 Bundle digest</text><text x="625" y="454" text-anchor="middle" class="s">Adapter 能力应标为 partial，而不是把 JSONL 存在等同于完整证据血缘</text></svg>
