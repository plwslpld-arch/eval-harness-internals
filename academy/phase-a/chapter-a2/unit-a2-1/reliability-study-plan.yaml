schema_version: 1
kind: ReliabilityStudyPlan
metadata:
  id: reliability-study-plan.a2-1.template
  version: 1.0.0
operationalization_spec_id: operationalization-spec.a2-1.template
objects:
  scoring_units: [trial, atomic-claim, state-transition]
  scorer_ids: [scorer.example.primary, scorer.example.independent-review]
conditions:
  fixed: [target-identity, observation-bundle, reference-version, rubric-version]
  allowed_to_vary: [execution-worker, replay-environment, blinded-rater, repetition]
dimensions:
  repeatability: same-scorer-same-evidence-controlled-repetition
  reproducibility: frozen-evidence-replayed-across-declared-equivalent-environments
  intra_rater: same-rater-blind-rescore-after-washout
  inter_rater: independent-raters-score-the-same-units
statistics_by_output:
  binary: confusion-matrix-and-cohens-kappa-with-critical-class-recall
  ordinal: weighted-kappa-with-declared-distance
  continuous: absolute-agreement-icc
  ranking: rank-correlation-plus-pairwise-decision-agreement
  span: version-bound-overlap-and-boundary-tolerance
  set: acceptable-set-coverage
  trajectory: event-identity-order-and-invariant-agreement
anchors:
  required_types: [clear-positive, clear-negative, boundary, critical-failure, missing-evidence, reasonable-multivalue, adversarial]
  source: independently-governed-calibration-set
repetition:
  planned_count: 3
  independence: blind-and-no-cross-rater-result-sharing
disagreement:
  preserve_raw_results: true
  categories: [reference-conflict, rubric-ambiguity, observation-gap, implementation-defect, legitimate-domain-disagreement]
  resolution: independent-adjudication-or-set-valued-resolution
status: planned
current_conclusion: not-established
