schema_version: 1
kind: MeasurementCharter
metadata:
  id: measurement-charter.a2-1.template
  version: 1.0.0
decision_context:
  owner_role: product-risk-owner
  decision: determine-whether-measurement-evidence-may-enter-a-later-system-gate
  candidate_actions: [admit-evidence, restrict-claim, collect-more-evidence, reject-measurement]
intended_interpretation: Indicators and rules may support bounded interpretations of declared constructs only after planned quality evidence is observed.
prohibited_interpretations:
  - a-proxy-is-the-construct-itself
  - reliability-alone-establishes-validity
  - design-completion-proves-target-quality
  - measurement-quality-ready-authorizes-production-release
target_scope:
  target_ids: [target.example.candidate]
  population: declared-evaluation-population
  scenarios: declared-scenario-space
  time_boundary: declared-study-window
upstream_traceability:
  risk_ids: [risk.example.critical]
  question_ids: [eq.example.measure]
  task_ids: [task.example.evaluate]
construct_ids: [construct.example.quality]
claim_boundary:
  supports: bounded-construct-interpretation-for-declared-target-population-and-conditions
  excludes: [unobserved-populations, production-safety, release-authorization, personal-mastery]
  current_status: design-only
