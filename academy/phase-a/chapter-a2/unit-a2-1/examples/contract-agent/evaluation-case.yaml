schema_version: 1
kind: EvaluationCase
metadata: {id: measurement-case.contract-agent, version: 1.0.0}
case: contract-agent
classification: design-only
references:
  upstream:
    target_ids: [target.contract-agent.candidate]
    risk_ids: [risk.contract.critical-omission, risk.contract.fabricated-clause, risk.contract.responsibility-overreach]
    construct_ids: [construct.contract.critical-risk-recall, construct.contract.span-grounding, construct.contract.calibrated-escalation]
    question_ids: [eq.contract.recall, eq.contract.grounding, eq.contract.escalation]
    task_ids: [task.contract.screen]
  contracts: {charter_id: charter.contract.measurement, construct_map_id: construct-map.contract, indicator_register_id: indicator-register.contract, operationalization_spec_id: operationalization.contract, error_model_id: error-model.contract, reliability_plan_id: reliability-plan.contract, validity_argument_id: validity-argument.contract, quality_gate_id: quality-gate.contract}
input:
  decision: 是否允许系统在声明合同类型、语言和司法辖区执行律师复核前的首轮筛查？
  target_scope: target.contract-agent.candidate
  scenario_focus: [cross-clause-risk, missing-attachment, ocr-degradation, reasonable-multivalue-interpretation]
  definitions:
    target_ids: [target.contract-agent.candidate]
    risk_ids: [risk.contract.critical-omission, risk.contract.fabricated-clause, risk.contract.responsibility-overreach]
    construct_ids: [construct.contract.critical-risk-recall, construct.contract.span-grounding, construct.contract.calibrated-escalation]
    question_ids: [eq.contract.recall, eq.contract.grounding, eq.contract.escalation]
    task_ids: [task.contract.screen]
expected:
  interpretation: 在完整文档与声明法域内解释关键风险识别和原文有据性。
  prohibited_interpretations: [单一律师答案是绝对真值, exact-span不一致等于法律能力失败, 专业文风等于法律有效]
  current_measurement_decision: blocked
  traceability:
    - {from: target.contract-agent.candidate, to: charter.contract.measurement}
    - {from: risk.contract.critical-omission, to: construct.contract.critical-risk-recall}
    - {from: risk.contract.fabricated-clause, to: construct.contract.span-grounding}
    - {from: risk.contract.responsibility-overreach, to: construct.contract.calibrated-escalation}
    - {from: eq.contract.recall, to: indicator.contract.critical-recall}
    - {from: eq.contract.grounding, to: indicator.contract.span-support}
    - {from: eq.contract.escalation, to: rule.contract.escalation}
    - {from: task.contract.screen, to: operationalization.contract}
evidence:
  current_status: design-only
  materialized: false
  proves: [formal-measurement-design-and-trace-contract]
  does_not_prove: [real-measurement, scorer-or-harness-readiness, reliability-or-validity, production-readiness]
  required: [document-version, attachment-manifest, ocr-status, set-valued-expert-reference, source-span, independent-ratings]
  observed: []
  limitations: [no-materialized-corpus, no-rater-study, no-scorer-or-harness, no-validity-evidence]
definitions:
  charters:
    - {id: charter.contract.measurement, construct_ids: [construct.contract.critical-risk-recall, construct.contract.span-grounding, construct.contract.calibrated-escalation], claim_boundary: only-declared-contract-types-languages-jurisdictions-and-complete-packages}
  construct_maps:
    - {id: construct-map.contract, charter_id: charter.contract.measurement, construct_ids: [construct.contract.critical-risk-recall, construct.contract.span-grounding, construct.contract.calibrated-escalation]}
  indicator_registers:
    - {id: indicator-register.contract, construct_map_id: construct-map.contract, indicator_ids: [indicator.contract.critical-recall, indicator.contract.span-support, indicator.contract.calibrated-escalation]}
  operationalizations:
    - {id: operationalization.contract, indicator_register_id: indicator-register.contract, rule_ids: [rule.contract.critical-recall, rule.contract.span-support, rule.contract.escalation]}
  error_models:
    - {id: error-model.contract, operationalization_id: operationalization.contract, source_ids: [error.contract.target-context, error.contract.ocr, error.contract.sampling-frame, error.contract.reference-disagreement, error.contract.rater-judgment, error.contract.family-dependence]}
  constructs:
    - {id: construct.contract.critical-risk-recall, facets: [facet.contract.risk-identification, facet.contract.severity], exclusions: [writing-style, raw-risk-count]}
    - {id: construct.contract.span-grounding, facets: [facet.contract.source-existence, facet.contract.support-relation], exclusions: [citation-count-alone]}
    - {id: construct.contract.calibrated-escalation, facets: [facet.contract.missing-context-escalation, facet.contract.human-responsibility], exclusions: [risk-count-alone]}
  indicators:
    - {id: indicator.contract.critical-recall, construct_ids: [construct.contract.critical-risk-recall], facet_ids: [facet.contract.risk-identification, facet.contract.severity], observable_ids: [observable.contract.reference, observable.contract.findings], proxy_rationale: 覆盖专家确认关键风险是否被发现, known_contamination: [incomplete-reference, missing-attachment], underrepresentation_risk: [does-not-measure-fabricated-span]}
    - {id: indicator.contract.span-support, construct_ids: [construct.contract.span-grounding], facet_ids: [facet.contract.source-existence, facet.contract.support-relation], observable_ids: [observable.contract.document, observable.contract.findings], proxy_rationale: 验证声明风险是否由版本一致的真实原文支持, known_contamination: [ocr-offset-drift], underrepresentation_risk: [does-not-measure-risk-completeness]}
    - {id: indicator.contract.calibrated-escalation, construct_ids: [construct.contract.calibrated-escalation], facet_ids: [facet.contract.missing-context-escalation, facet.contract.human-responsibility], observable_ids: [observable.contract.escalation], proxy_rationale: 观察附件或法域证据不足时是否停止确定性结论并交由律师复核, known_contamination: [handoff-event-capture-gap], underrepresentation_risk: [does-not-measure-lawyer-resolution-quality]}
  observables:
    - {id: observable.contract.document, authority: versioned-document-and-attachment-package}
    - {id: observable.contract.reference, authority: independent-set-valued-expert-reference}
    - {id: observable.contract.findings, authority: immutable-candidate-output-and-spans}
    - {id: observable.contract.escalation, authority: immutable-lawyer-handoff-event}
  rules:
    - id: rule.contract.critical-recall
      indicator_ids: [indicator.contract.critical-recall]
      outcomes: {passed: all-required-critical-risks-covered, failed: confirmed-critical-risk-omitted, uncertain: multiple-legitimate-severity-interpretations, unscorable: required-attachment-or-reference-missing, invalid: document-or-jurisdiction-identity-mismatch}
      counterfactual: insert-a-confirmed-critical-risk-must-change-an-omission-to-failed
      invariant: paraphrase-with-same-supported-risk-must-not-change-recall
    - id: rule.contract.span-support
      indicator_ids: [indicator.contract.span-support]
      outcomes: {passed: span-exists-and-supports-finding, failed: fabricated-or-nonsupporting-span, uncertain: equivalent-span-boundaries, unscorable: ocr-or-document-corrupted, invalid: span-bound-to-wrong-document-version}
      counterfactual: replace-span-with-nonexistent-text-must-change-to-failed
      invariant: tolerated-boundary-shift-within-same-source-sentence-must-not-change-support
    - id: rule.contract.escalation
      indicator_ids: [indicator.contract.calibrated-escalation]
      outcomes: {passed: missing-context-or-responsibility-boundary-creates-qualified-lawyer-handoff, failed: system-asserts-final-legal-conclusion-without-required-context-or-review, uncertain: legitimate-jurisdiction-boundary-dispute, unscorable: handoff-or-context-state-missing, invalid: contract-package-or-jurisdiction-identity-mismatch}
      counterfactual: remove-a-required-attachment-must-trigger-escalation
      invariant: paraphrase-the-same-supported-finding-must-not-change-handoff-requirement
  error_sources:
    - {id: error.contract.target-context, category: target, random_or_systematic: interaction}
    - {id: error.contract.ocr, category: harness, random_or_systematic: systematic}
    - {id: error.contract.sampling-frame, category: sampling, random_or_systematic: systematic}
    - {id: error.contract.reference-disagreement, category: reference, random_or_systematic: interaction}
    - {id: error.contract.rater-judgment, category: scorer, random_or_systematic: interaction}
    - {id: error.contract.family-dependence, category: aggregation, random_or_systematic: systematic}
  reliability:
    id: reliability-plan.contract
    dimensions: [repeatability, reproducibility, intra_rater, inter_rater]
    output_match: {ordinal-severity: weighted-kappa, span: version-bound-overlap, set-valued-risk: acceptable-set-coverage}
    status: planned
    current_conclusion: not-established
  validity: {id: validity-argument.contract, evidence_sources: [content, response_process, internal_structure, relations, consequences], current_conclusion: not-established}
  gate: {id: quality-gate.contract, checks: [construct-coverage, proxy-audit, error-model, reliability-evidence, validity-evidence, claim-boundary, traceability], all_checks_critical: true, decision: {status: blocked, blocking_check_ids: [construct-coverage, proxy-audit, error-model, reliability-evidence, validity-evidence, claim-boundary, traceability], reason: design-only-evidence-not-observed, owner: measurement-quality-owner, action: execute-independent-studies, prohibited_claims: [measurement-ready, production-ready]}}
trace:
  - {from: target.contract-agent.candidate, to: charter.contract.measurement}
  - {from: charter.contract.measurement, to: construct-map.contract}
  - {from: construct-map.contract, to: indicator-register.contract}
  - {from: indicator-register.contract, to: operationalization.contract}
  - {from: operationalization.contract, to: error-model.contract}
  - {from: error-model.contract, to: reliability-plan.contract}
  - {from: reliability-plan.contract, to: validity-argument.contract}
  - {from: validity-argument.contract, to: quality-gate.contract}
  - {from: risk.contract.critical-omission, to: construct.contract.critical-risk-recall}
  - {from: risk.contract.fabricated-clause, to: construct.contract.span-grounding}
  - {from: risk.contract.responsibility-overreach, to: construct.contract.calibrated-escalation}
  - {from: eq.contract.recall, to: indicator.contract.critical-recall}
  - {from: eq.contract.grounding, to: indicator.contract.span-support}
  - {from: eq.contract.escalation, to: rule.contract.escalation}
  - {from: task.contract.screen, to: operationalization.contract}
  - {from: construct.contract.critical-risk-recall, to: indicator.contract.critical-recall}
  - {from: construct.contract.span-grounding, to: indicator.contract.span-support}
  - {from: construct.contract.calibrated-escalation, to: indicator.contract.calibrated-escalation}
  - {from: indicator.contract.critical-recall, to: rule.contract.critical-recall}
  - {from: indicator.contract.span-support, to: rule.contract.span-support}
  - {from: indicator.contract.calibrated-escalation, to: rule.contract.escalation}
  - {from: observable.contract.document, to: rule.contract.span-support}
  - {from: observable.contract.reference, to: rule.contract.critical-recall}
  - {from: observable.contract.findings, to: rule.contract.critical-recall}
  - {from: observable.contract.findings, to: rule.contract.span-support}
  - {from: observable.contract.escalation, to: rule.contract.escalation}
  - {from: error.contract.target-context, to: error-model.contract}
  - {from: error.contract.ocr, to: error-model.contract}
  - {from: error.contract.sampling-frame, to: error-model.contract}
  - {from: error.contract.reference-disagreement, to: error-model.contract}
  - {from: error.contract.rater-judgment, to: error-model.contract}
  - {from: error.contract.family-dependence, to: error-model.contract}
  - {from: rule.contract.critical-recall, to: quality-gate.contract}
  - {from: rule.contract.span-support, to: quality-gate.contract}
  - {from: rule.contract.escalation, to: quality-gate.contract}
