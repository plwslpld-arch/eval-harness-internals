schema_version: 1
kind: ConstructMap
metadata:
  id: construct-map.a2-1.template
  version: 1.0.0
measurement_charter_id: measurement-charter.a2-1.template
constructs:
  - id: construct.example.quality
    definition: The bounded quality property the decision needs to interpret but cannot observe directly.
    facets:
      - id: facet.example.effectiveness
        definition: The intended task outcome is achieved under eligible conditions.
      - id: facet.example.safety
        definition: Critical prohibited outcomes and unsafe state changes are avoided.
    exclusions:
      - stylistic-polish-alone
      - user-preference-alone
      - implementation-choice
    criticality: critical
    decision_relevance: Both effectiveness and non-compensable safety evidence are required before the construct can support a later decision.
