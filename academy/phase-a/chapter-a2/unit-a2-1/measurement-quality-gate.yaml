schema_version: 1
kind: MeasurementQualityGate
metadata:
  id: measurement-quality-gate.a2-1.template
  version: 1.0.0
measurement_charter_id: measurement-charter.a2-1.template
checks:
  - {id: check.construct-coverage, critical: true, status: not-observed, requires: [construct-map.a2-1.template]}
  - {id: check.proxy-audit, critical: true, status: not-observed, requires: [indicator-register.a2-1.template]}
  - {id: check.error-model, critical: true, status: not-observed, requires: [measurement-error-model.a2-1.template]}
  - {id: check.reliability-evidence, critical: true, status: not-observed, requires: [reliability-study-plan.a2-1.template]}
  - {id: check.validity-evidence, critical: true, status: not-observed, requires: [validity-argument.a2-1.template]}
  - {id: check.claim-boundary, critical: true, status: planned, requires: [measurement-charter.a2-1.template]}
  - {id: check.traceability, critical: true, status: planned, requires: [operationalization-spec.a2-1.template]}
decision:
  status: blocked
  blocking_check_ids:
    - check.construct-coverage
    - check.proxy-audit
    - check.error-model
    - check.reliability-evidence
    - check.validity-evidence
    - check.claim-boundary
    - check.traceability
  reason: Design contracts exist, but reliability and validity evidence are planned or not observed; design-only status cannot become ready.
  owner: measurement-quality-owner
  action: complete-independent-studies-before-any-measurement-readiness-claim
  prohibited_claims: [claim-ready, enter-system-release-gate, authorize-production, claim-personal-mastery]
