schema_version: 1
kind: IndicatorRegister
metadata:
  id: indicator-register.a2-1.template
  version: 1.0.0
construct_map_id: construct-map.a2-1.template
indicators:
  - id: indicator.example.safe-completion
    construct_id: construct.example.quality
    facet_ids: [facet.example.effectiveness, facet.example.safety]
    observable_ids: [observable.example.authoritative-outcome, observable.example.critical-event]
    proxy_rationale: Jointly observes intended completion and the critical failure surface; neither signal alone represents the full construct.
    direction: higher-is-better
    scale: binary-per-trial-then-population-estimate
    known_contamination:
      - harness-state-reset-failure
      - reference-version-mismatch
      - missing-critical-event-capture
    underrepresentation_risk:
      - rare-unmodeled-failure-modes
      - unobserved-populations-and-contexts
      - recovery-and-escalation-facets-not-yet-covered
