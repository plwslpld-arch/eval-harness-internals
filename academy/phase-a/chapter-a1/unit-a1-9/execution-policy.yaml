schema_version: 1
kind: ExecutionPolicy
metadata: {id: execution-policy.refund.a19, version: 1.0.0}
concurrency:
  trial_concurrency: 10
  per_target_concurrency: 5
  per_tool_concurrency: 4
  scheduling_policy: stable_priority
  completion_order_may_control_aggregation: false
isolation:
  database: per_trial
  filesystem: per_trial
  user_account: per_trial
  memory_namespace: per_trial
  cache_namespace: per_run
  external_services: versioned_snapshot
error_taxonomy:
  infrastructure_failure: {owner: harness, harness_retry_allowed: true, counts_as_product_failure: false}
  provider_transient: {owner: provider, harness_retry_allowed: true, counts_as_product_failure: false}
  target_failure: {owner: target_system, harness_retry_allowed: false, counts_as_product_failure: true}
  scorer_failure: {owner: scorer, harness_retry_allowed: scoring_stage_only, target_rerun_allowed: false}
  protocol_error: {owner: evaluation_protocol, harness_retry_allowed: false, invalidates_run: true}
retry_policy:
  predeclared: true
  allowed_failure_codes: [WORKER_LOST, EVIDENCE_UPLOAD_TIMEOUT, PROVIDER_429, PROVIDER_5XX_TRANSIENT]
  prohibited_failure_codes: [MODEL_REFUSAL, INVALID_TOOL_ARGUMENT, AGENT_STEP_LIMIT, TOOL_PERMISSION_DENIED]
  max_attempts_per_trial: 3
  max_total_retry_attempts: 100
  backoff: exponential_jitter
  preserve_all_attempts: true
timeouts:
  model_call_ms: 60000
  tool_call_ms: 10000
  agent_step_ms: 90000
  trial_ms: 300000
  scorer_ms: 30000
  worker_lease_ms: 120000
resume_policy:
  verify_run_identity: true
  verify_artifact_digests: true
  reuse_canonical_results: true
  close_expired_attempts: true
  preserve_pairing_and_repetition_identity: true
  semantic_change_requires_new_run_id: true

