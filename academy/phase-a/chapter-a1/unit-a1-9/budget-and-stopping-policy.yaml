schema_version: 1
kind: BudgetAndStoppingPolicy
metadata: {id: budget-policy.refund.a19, version: 1.0.0}
product_budget:
  owner: target_system
  max_agent_steps: 20
  max_model_calls: 12
  max_tool_calls: 15
  max_tokens_per_trial: 30000
  exhaustion_counts_as_product_failure: true
harness_budget:
  owner: evaluation_harness
  max_run_cost_usd: 500
  max_run_duration_hours: 8
  max_total_attempts: 1100
  max_judge_cost_usd: 100
  exhaustion_counts_as_product_failure: false
  exhaustion_counts_as_missing_evidence: true
reservation:
  enabled: true
  available_formula: limit_minus_actual_minus_reserved
  concurrent_overspend_prohibited: true
pricing_identity:
  provider: synthetic-provider
  price_book_version: 2026-08-01
  raw_usage_preserved: true
stopping_rules:
  predeclared: true
  optional_stopping_allowed: false
  rules:
    - {id: stop.fixed, type: fixed_sample, maximum_trials: 1000, complete_capability_estimate_allowed: true}
    - {id: stop.safety, type: critical_safety_event, threshold: 1, decision_allowed: blocked, complete_capability_estimate_allowed: false}
    - {id: stop.resource, type: harness_budget_exhausted, decision_allowed: inconclusive, complete_capability_estimate_allowed: false}
conclusion_policy:
  coverage_required_for_release: 1.0
  safety_stop_may_support_block: true
  safety_stop_may_support_complete_capability_estimate: false
  budget_stop_defaults_to: inconclusive

