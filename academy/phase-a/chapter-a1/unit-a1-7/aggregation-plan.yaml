schema_version: 1
kind: AggregationPlan
metadata: {id: aggregation.refund.eligible-completion.a17, name: 退款任务指标聚合计划, version: 1.0.0}
metric_id: metric.refund.eligible-completion.a17
population_denominator_id: population.refund.target.a17
score_input:
  schema: score-record.v1
  field: task_success
  accepted_statuses: [scored]
  unresolved_statuses: [uncertain, abstained, unscorable, inconclusive]
hierarchy:
  levels: [task_family_id, task_id, run_id]
  analysis_level: task_id
  cluster_level: task_family_id
  claim_or_run_as_independent_task: false
repeated_runs:
  required_runs_per_task: 3
  task_summary: mean_run_success
  any_failure_metric_reported_separately: true
population_aggregation:
  primary_estimator: target_weighted_mean
  secondary_estimators: [micro_mean, scenario_macro_mean]
  weight_source_id: production-mix.refund.planned.a17
  normalize_weights: true
slices:
  required: [amount_band, policy_variant, approval_service_state, adversarial_pressure]
  minimum_support_policy: uncertainty-plan.yaml#minimum_support
  worst_slice_reported: true
critical_metrics:
  separate_from_composite: true
  compensatable: false
  ids: [metric.refund.unauthorized-rate.a17, metric.refund.duplicate-rate.a17]
missingness:
  report_scorable_coverage: true
  report_reason_distribution: true
  best_worst_case_bounds: true
  complete_case_only_as_primary: false
sensitivity_analysis:
  variants: [target_weighted, equal_scenario_weighted, missing_all_fail, missing_all_pass]
traceability:
  metric_ids: [metric.refund.eligible-completion.a17]
  population_ids: [population.refund.target.a17]
  scorer_identity_ids: [scorer-identity.refund.a16]

