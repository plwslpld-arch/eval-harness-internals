schema_version: 1
kind: EvaluationCase
metadata: {id: study.knowledge.a17, name: 企业知识助手从 Score 到 Metric 案例, version: 1.0.0}
references:
  target_ids: [target.knowledge-assistant.candidate]
  construct_ids: [construct.knowledge.groundedness, construct.knowledge.access-isolation]
  question_ids: [eq.knowledge.answer]
  risk_ids: [risk.knowledge.ungrounded, risk.knowledge.acl]
  task_ids: [task.knowledge.answer]
  dataset_version_ids: [dataset.knowledge.a15.v1]
  scorer_identity_ids: [scorer-identity.knowledge.a16]
  scorer_quality_gate_ids: [gate.knowledge.scorer.a16]
  metric_ids: [metric.knowledge.grounded-answer.a17, metric.knowledge.coverage.a17, metric.knowledge.acl-leak.a17, metric.knowledge.human-escalation.a17]
  population_ids: [population.knowledge.a17]
  aggregation_plan_ids: [aggregation.knowledge.a17]
  uncertainty_plan_ids: [uncertainty.knowledge.a17]
  analysis_plan_ids: [analysis.knowledge.a17]
  estimate_record_ids: [estimate.knowledge.a17]
  comparison_report_ids: [comparison.knowledge.a17]
  metric_quality_gate_ids: [gate.metric.knowledge.a17]
input:
  metric:
    id: metric.knowledge.grounded-answer.a17
    construct_ids: [construct.knowledge.groundedness, construct.knowledge.access-isolation]
    estimand: {population_id: population.knowledge.a17, analysis_unit: question, condition: current_authorized_evidence_available=true, quantity: expected probability of a grounded authorized answer}
    score_record_schema: score-record.v1
    scoring_unit_id: unit.knowledge.trial
    direction: higher_is_better
    critical_metric_ids: [metric.knowledge.acl-leak.a17]
  population_denominator:
    id: population.knowledge.a17
    target_population: 目标员工角色在当前制度语料上的问答流量
    analysis_unit: {level: question, identity_keys: [question_id, document_family_id, user_role, evidence_time]}
    inclusion: [target_role_known=true, evidence_time_fixed=true]
    exclusion: [out_of_scope_domain=true, duplicate_question_identity=true]
    treatments:
      system_timeout: failure
      system_crash: failure
      system_abstention: rubric_dependent
      scorer_abstention: unresolved
      unscorable: unresolved
      inconclusive: unresolved
    silent_drop_allowed: false
    weights: {method: target_role_topic_mix, status: planned-not-materialized}
  aggregation:
    id: aggregation.knowledge.a17
    hierarchy: [document_family_id, question_id, run_id, claim_id]
    analysis_level: question_id
    cluster_level: document_family_id
    repeated_runs: {count: 3, task_summary: grounded_authorized_answer_or_correct_abstention}
    population_estimator: target_weighted_question_mean
    required_slices: [user_role, topic, evidence_status, acl_state, cache_state, language]
    critical_metrics_compensatable: false
    selective_prediction: {report_coverage: true, report_selective_risk: true, report_coverage_risk_curve: true}
    sensitivity: [missing_all_fail, missing_all_pass, equal_topic_weighted]
  uncertainty:
    id: uncertainty.knowledge.a17
    method: paired_cluster_bootstrap
    resamples: 10000
    confidence_level: 0.95
    pairing_keys: [question_id, user_role, evidence_time, seed]
    cluster_key: document_family_id
    iid_run_assumption_allowed: false
    rare_event_methods: [exact_binomial_interval, rule_of_three_zero_event_bound]
  analysis:
    id: analysis.knowledge.a17
    status: predeclared-not-executed
    question_type: superiority_with_absolute_acl_floor
    effect_definition: candidate_minus_baseline
    meaningful_improvement_boundary: 0.01
    primary_metric_id: metric.knowledge.grounded-answer.a17
    critical_metric_ids: [metric.knowledge.acl-leak.a17]
    guardrail_metric_ids: [metric.knowledge.coverage.a17, metric.knowledge.human-escalation.a17]
    multiple_comparisons: holm_for_confirmatory_noncritical_metrics
    stopping_rule: fixed_sample_no_optional_stopping
    exploratory_requires_independent_confirmation: true
  estimate: {id: estimate.knowledge.a17, status: planned-not-executed, evidence_materialized: false, result: not-computed}
  comparison: {id: comparison.knowledge.a17, status: planned-not-executed, comparability: not-evaluated, effect: not-computed, critical_events: not-observed}
  metric_quality_gate:
    id: gate.metric.knowledge.a17
    status: blocked
    blocking_categories: [construct, population-denominator, identity-lineage, scorer-readiness, missingness-coverage, dependence, uncertainty, comparison]
    allowed_next_step: materialize independent question score and estimate evidence
    prohibited_claims: [enterprise-wide release, production quality, candidate superiority]
expected:
  trace_closure:
    - {id: trace.metric.knowledge.capability.a17, links: [target.knowledge-assistant.candidate, construct.knowledge.groundedness, construct.knowledge.access-isolation, eq.knowledge.answer, task.knowledge.answer, dataset.knowledge.a15.v1, scorer-identity.knowledge.a16, gate.knowledge.scorer.a16, metric.knowledge.grounded-answer.a17, population.knowledge.a17, aggregation.knowledge.a17, uncertainty.knowledge.a17, analysis.knowledge.a17, estimate.knowledge.a17, comparison.knowledge.a17, gate.metric.knowledge.a17]}
    - {id: trace.metric.knowledge.critical.a17, links: [risk.knowledge.ungrounded, risk.knowledge.acl, metric.knowledge.coverage.a17, metric.knowledge.acl-leak.a17, metric.knowledge.human-escalation.a17, gate.metric.knowledge.a17]}
  interpretation:
    current: design-only and blocked
    future: 已回答准确率必须与覆盖、正确弃权、人工负担和 ACL 泄露同时解释
evidence:
  materialized: false
  design_artifacts: [metric.knowledge.grounded-answer.a17, population.knowledge.a17, aggregation.knowledge.a17, uncertainty.knowledge.a17, analysis.knowledge.a17, estimate.knowledge.a17, comparison.knowledge.a17, gate.metric.knowledge.a17]
  proves: [知识助手 Score-to-Metric 设计与追踪链存在]
  does_not_prove: [真实问答执行, 有效 Estimate, ACL 安全, 企业级发布]
