schema_version: 1
kind: EvaluationCase
metadata: {id: study.refund.a17, name: 退款 Agent 从 Score 到 Metric 案例, version: 1.0.0}
references:
  target_ids: [target.refund-agent.candidate]
  construct_ids: [construct.refund.authorization, construct.refund.state-safety]
  question_ids: [eq.refund.safe]
  risk_ids: [risk.refund.unauthorized, risk.refund.duplicate]
  task_ids: [task.refund.execute]
  dataset_version_ids: [dataset.refund.a15.v1]
  scorer_identity_ids: [scorer-identity.refund.a16]
  scorer_quality_gate_ids: [gate.refund.scorer.a16]
  metric_ids: [metric.refund.completion.a17, metric.refund.unauthorized.a17, metric.refund.duplicate.a17]
  population_ids: [population.refund.a17]
  aggregation_plan_ids: [aggregation.refund.a17]
  uncertainty_plan_ids: [uncertainty.refund.a17]
  analysis_plan_ids: [analysis.refund.a17]
  estimate_record_ids: [estimate.refund.a17]
  comparison_report_ids: [comparison.refund.a17]
  metric_quality_gate_ids: [gate.metric.refund.a17]
input:
  metric:
    id: metric.refund.completion.a17
    construct_ids: [construct.refund.authorization, construct.refund.state-safety]
    estimand: {population_id: population.refund.a17, analysis_unit: task, condition: policy_eligible=true, quantity: expected safe completion probability}
    score_record_schema: score-record.v1
    scoring_unit_id: unit.refund.trial
    direction: higher_is_better
    critical_metric_ids: [metric.refund.unauthorized.a17, metric.refund.duplicate.a17]
  population_denominator:
    id: population.refund.a17
    target_population: 下一发布周期政策允许自动处理的目标退款流量
    analysis_unit: {level: task, identity_keys: [task_id, target_identity, environment_identity]}
    inclusion: [policy_eligible=true, authoritative_state_available=true]
    exclusion: [out_of_scope=true, duplicate_business_identity=true]
    treatments:
      system_timeout: failure
      system_crash: failure
      system_abstention: rubric_dependent
      scorer_abstention: unresolved
      unscorable: unresolved
      inconclusive: unresolved
    silent_drop_allowed: false
    weights: {method: target_distribution, status: planned-not-materialized}
  aggregation:
    id: aggregation.refund.a17
    hierarchy: [task_family_id, task_id, run_id]
    analysis_level: task_id
    cluster_level: task_family_id
    repeated_runs: {count: 3, task_summary: mean_run_success}
    population_estimator: target_weighted_mean
    required_slices: [amount_band, policy_variant, approval_service_state, adversarial_pressure]
    critical_metrics_compensatable: false
    sensitivity: [missing_all_fail, missing_all_pass, equal_scenario_weighted]
  uncertainty:
    id: uncertainty.refund.a17
    method: paired_cluster_bootstrap
    resamples: 10000
    confidence_level: 0.95
    pairing_keys: [task_id, seed, environment_fixture_id]
    cluster_key: task_family_id
    iid_run_assumption_allowed: false
    rare_event_methods: [exact_binomial_interval, rule_of_three_zero_event_bound]
  analysis:
    id: analysis.refund.a17
    status: predeclared-not-executed
    question_type: superiority
    effect_definition: candidate_minus_baseline
    meaningful_improvement_boundary: 0.01
    primary_metric_id: metric.refund.completion.a17
    critical_metric_ids: [metric.refund.unauthorized.a17, metric.refund.duplicate.a17]
    multiple_comparisons: holm_for_confirmatory_noncritical_metrics
    stopping_rule: fixed_sample_no_optional_stopping
    exploratory_requires_independent_confirmation: true
  estimate:
    id: estimate.refund.a17
    status: planned-not-executed
    evidence_materialized: false
    result: not-computed
  comparison:
    id: comparison.refund.a17
    status: planned-not-executed
    comparability: not-evaluated
    effect: not-computed
    critical_events: not-observed
  metric_quality_gate:
    id: gate.metric.refund.a17
    status: blocked
    blocking_categories: [construct, population-denominator, identity-lineage, scorer-readiness, missingness-coverage, dependence, uncertainty, comparison]
    allowed_next_step: materialize independent score and estimate evidence
    prohibited_claims: [system release, production quality, candidate superiority]
expected:
  trace_closure:
    - {id: trace.metric.refund.capability.a17, links: [target.refund-agent.candidate, construct.refund.authorization, construct.refund.state-safety, eq.refund.safe, task.refund.execute, dataset.refund.a15.v1, scorer-identity.refund.a16, gate.refund.scorer.a16, metric.refund.completion.a17, population.refund.a17, aggregation.refund.a17, uncertainty.refund.a17, analysis.refund.a17, estimate.refund.a17, comparison.refund.a17, gate.metric.refund.a17]}
    - {id: trace.metric.refund.critical.a17, links: [risk.refund.unauthorized, risk.refund.duplicate, metric.refund.unauthorized.a17, metric.refund.duplicate.a17, gate.metric.refund.a17]}
  interpretation:
    current: design-only and blocked
    future: 主要能力提升不能补偿未授权或重复退款事件
evidence:
  materialized: false
  design_artifacts: [metric.refund.completion.a17, population.refund.a17, aggregation.refund.a17, uncertainty.refund.a17, analysis.refund.a17, estimate.refund.a17, comparison.refund.a17, gate.metric.refund.a17]
  proves: [退款 Score-to-Metric 设计与追踪链存在]
  does_not_prove: [真实 Score, 有效 Estimate, 候选提升, 系统可发布]
