schema_version: 1
kind: EvaluationCase
metadata: {id: study.contract.a17, name: 合同审查 Agent 从 Score 到 Metric 案例, version: 1.0.0}
references:
  target_ids: [target.contract-agent.candidate]
  construct_ids: [construct.contract.critical-recall, construct.contract.span-grounding]
  question_ids: [eq.contract.screen]
  risk_ids: [risk.contract.omission, risk.contract.fabrication]
  task_ids: [task.contract.screen]
  dataset_version_ids: [dataset.contract.a15.v1]
  scorer_identity_ids: [scorer-identity.contract.a16]
  scorer_quality_gate_ids: [gate.contract.scorer.a16]
  metric_ids: [metric.contract.critical-recall.a17, metric.contract.fabricated-span.a17, metric.contract.complete-screen.a17]
  population_ids: [population.contract.a17]
  aggregation_plan_ids: [aggregation.contract.a17]
  uncertainty_plan_ids: [uncertainty.contract.a17]
  analysis_plan_ids: [analysis.contract.a17]
  estimate_record_ids: [estimate.contract.a17]
  comparison_report_ids: [comparison.contract.a17]
  metric_quality_gate_ids: [gate.metric.contract.a17]
input:
  metric:
    id: metric.contract.critical-recall.a17
    construct_ids: [construct.contract.critical-recall, construct.contract.span-grounding]
    estimand: {population_id: population.contract.a17, analysis_unit: contract, condition: high_value_contract=true, quantity: expected critical-risk recall}
    score_record_schema: score-record.v1
    scoring_unit_id: unit.contract.trial
    direction: higher_is_better
    critical_metric_ids: [metric.contract.fabricated-span.a17, metric.contract.complete-screen.a17]
  population_denominator:
    id: population.contract.a17
    target_population: 高价值采购合同首轮风险筛查总体
    analysis_unit: {level: contract, identity_keys: [contract_id, contract_family_id, target_identity]}
    inclusion: [high_value_contract=true, licensed_source=true, reference_available=true]
    exclusion: [out_of_scope_jurisdiction=true, duplicate_contract_identity=true]
    treatments:
      system_timeout: failure
      system_crash: failure
      system_abstention: rubric_dependent
      scorer_abstention: unresolved
      unscorable: unresolved
      inconclusive: unresolved
    silent_drop_allowed: false
    weights: {method: target_contract_mix, status: planned-not-materialized}
  aggregation:
    id: aggregation.contract.a17
    hierarchy: [contract_family_id, contract_id, risk_finding_id, claim_id]
    analysis_level: contract_id
    cluster_level: contract_family_id
    repeated_runs: {count: 3, task_summary: all_critical_findings_recalled}
    population_estimator: target_weighted_contract_mean
    required_slices: [jurisdiction, contract_type, document_length, cross_page_clause, attachment_conflict, ocr_quality]
    critical_metrics_compensatable: false
    sensitivity: [set_valued_reference, missing_all_fail, family_macro_average]
  uncertainty:
    id: uncertainty.contract.a17
    method: paired_cluster_bootstrap
    resamples: 10000
    confidence_level: 0.95
    pairing_keys: [contract_id, seed, document_snapshot_id]
    cluster_key: contract_family_id
    iid_run_assumption_allowed: false
    rare_event_methods: [exact_binomial_interval]
  analysis:
    id: analysis.contract.a17
    status: predeclared-not-executed
    question_type: non_inferiority_with_absolute_safety_floor
    effect_definition: candidate_minus_baseline
    non_inferiority_margin: -0.01
    primary_metric_id: metric.contract.critical-recall.a17
    critical_metric_ids: [metric.contract.fabricated-span.a17, metric.contract.complete-screen.a17]
    multiple_comparisons: holm_for_confirmatory_noncritical_metrics
    stopping_rule: fixed_sample_no_optional_stopping
    exploratory_requires_independent_confirmation: true
  estimate: {id: estimate.contract.a17, status: planned-not-executed, evidence_materialized: false, result: not-computed}
  comparison: {id: comparison.contract.a17, status: planned-not-executed, comparability: not-evaluated, effect: not-computed, critical_events: not-observed}
  metric_quality_gate:
    id: gate.metric.contract.a17
    status: blocked
    blocking_categories: [construct, population-denominator, identity-lineage, scorer-readiness, missingness-coverage, dependence, uncertainty, comparison]
    allowed_next_step: materialize independent contract score and estimate evidence
    prohibited_claims: [autonomous legal approval, production quality, candidate non-inferiority]
expected:
  trace_closure:
    - {id: trace.metric.contract.capability.a17, links: [target.contract-agent.candidate, construct.contract.critical-recall, construct.contract.span-grounding, eq.contract.screen, task.contract.screen, dataset.contract.a15.v1, scorer-identity.contract.a16, gate.contract.scorer.a16, metric.contract.critical-recall.a17, population.contract.a17, aggregation.contract.a17, uncertainty.contract.a17, analysis.contract.a17, estimate.contract.a17, comparison.contract.a17, gate.metric.contract.a17]}
    - {id: trace.metric.contract.critical.a17, links: [risk.contract.omission, risk.contract.fabrication, metric.contract.fabricated-span.a17, metric.contract.complete-screen.a17, gate.metric.contract.a17]}
  interpretation:
    current: design-only and blocked
    future: claim 级高分不能掩盖任何一份合同的 Critical 漏检或伪造 span
evidence:
  materialized: false
  design_artifacts: [metric.contract.critical-recall.a17, population.contract.a17, aggregation.contract.a17, uncertainty.contract.a17, analysis.contract.a17, estimate.contract.a17, comparison.contract.a17, gate.metric.contract.a17]
  proves: [合同 Score-to-Metric 设计与追踪链存在]
  does_not_prove: [真实合同数据执行, 有效 Estimate, 非劣效, 法律适用性]
