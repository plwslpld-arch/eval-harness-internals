schema_version: 1
kind: MetricQualityGate
metadata: {id: gate.refund.metric.a17, name: 退款指标证据质量门, version: 1.0.0}
metric_id: metric.refund.eligible-completion.a17
estimate_record_id: estimate.refund.rc3.a17
comparison_report_id: comparison.refund.rc3-vs-v1.a17
status_values: {ready: 可进入系统决策, partial: 仅限已验证子范围, blocked: 证据不足, invalid: 合同或证据无效}
check_status_values: {passed: 已有独立物化证据, partial: 仅部分范围成立, blocked: 缺少证据, failed: 违反关键合同}
checks:
  - {id: check.metric.construct, category: construct, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.population, category: population-denominator, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.identity, category: identity-lineage, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.scorer, category: scorer-readiness, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.missingness, category: missingness-coverage, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.dependence, category: dependence, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.uncertainty, category: uncertainty, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
  - {id: check.metric.comparison, category: comparison, critical: true, status: blocked, evidence: {materialized: false, planned_only: true, evidence_links: []}}
decision:
  status: blocked
  blocking_check_ids: [check.metric.construct, check.metric.population, check.metric.identity, check.metric.scorer, check.metric.missingness, check.metric.dependence, check.metric.uncertainty, check.metric.comparison]
  partial_check_ids: []
  invalidating_check_ids: []
  reason: 只有公开设计，没有物化 Score、Estimate、比较结果或独立证据
  allowed_next_step: 实现评测运行与评分后生成独立证据
  prohibited_claims: [不得声称指标 ready, 不得声称候选优于基线, 不得用于系统发布 Gate]
evidence_boundary:
  proves: [指标设计与追踪合同存在]
  does_not_prove: [真实数据已执行, Scorer 已就绪, Estimate 有效, 系统可发布, 生产效果, 个人能力]
traceability:
  analysis_plan_ids: [analysis.refund.rc3-vs-v1.a17]
  upstream_scorer_quality_gate_ids: [gate.refund.scorer.a16]
