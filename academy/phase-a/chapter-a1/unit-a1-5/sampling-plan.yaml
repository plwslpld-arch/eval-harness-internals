schema_version: 1
kind: SamplingPlan
metadata: {id: sampling-plan.example.v1, name: 评测数据抽样计划模板, owner: evaluation-data-owner, version: 1.0.0}
dataset_charter_id: dataset-charter.example.v1
source_register_id: source-register.example.v1
traceability: {question_ids: [eq.example], risk_ids: [risk.example], scenario_family_ids: [family.normal, family.challenge, family.regression], task_ids: [task.example.v1]}
population: {definition: 继承 dataset charter 的目标总体, time_window: declared-window, primary_unit: task-opportunity, parent_unit: entity-or-document-family}
sampling_frame:
  frame_id: frame.example.snapshot.v1
  enumeration_key: immutable-record-id
  eligibility_snapshot: eligibility.example.v1
  undercoverage_review: required
  gaps:
    - {id: gap.example.offline, description: 抽样框缺少未进入在线记录的任务机会, affected_population_or_risk: 线下与中断任务, impact: 总体覆盖不足且不得推广到缺失子总体, owner: data-steward, action: 建立补充来源或缩小 claim boundary, status: blocked}
strata:
  - id: stratum.representative
    risk_ids: [risk.example]
    scenario_family_ids: [family.normal]
    definition: 按声明流量中的身份、任务类型、状态和时间分层
  - id: stratum.critical-boundary
    risk_ids: [risk.example]
    scenario_family_ids: [family.challenge, family.regression]
    definition: 按关键风险触发机制、边界、故障和历史事故分层
selection:
  distribution: {method: stratified-probability-sample, seed: recorded-seed, replacement: false, inclusion_probability_recorded: true}
  challenge: {method: risk-directed-selection, priority: severity-boundary-interaction, natural_frequency_claim: prohibited}
  regression: {method: incident-and-defect-freeze, admission: confirmed-reproducible-and-reviewed, mutable: false}
allocation:
  rule: 先满足关键风险最低语义覆盖，再按分层精度与资源分配 distribution 样本
  per_stratum: [{stratum_id: stratum.representative, target_count: declared-count, actual_count: not-materialized, status: blocked, rationale: 支持声明总体切片}, {stratum_id: stratum.critical-boundary, target_count: declared-count, actual_count: not-materialized, status: blocked, rationale: 覆盖关键失败机制；数量满足也不等于 critical 风险语义 ready}]
deduplication:
  exact_key: content-and-state-hash
  near_duplicate_method: semantic-plus-template-cluster-review
  parent_grouping_keys: [parent_id, entity_id, document_family_id, template_id]
  action: 同一依赖簇进入单一 split；重复项保留一条并记录映射
weighting: {distribution: inverse-inclusion-probability-if-used, challenge: none, regression: none, reporting_rule: 不合并不同分区为单一自然率}
partition_assignment:
  - {partition_id: partition.distribution, role: distribution, source_ids: [source.traffic.snapshot.v1], method: stratified-probability-sample, denominator_policy: 保留目标总体自然分母}
  - {partition_id: partition.challenge, role: challenge, source_ids: [source.expert.challenge.v1], method: risk-directed-selection, denominator_policy: 独立报告命中与失败，不推断自然发生率}
  - {partition_id: partition.regression, role: regression, source_ids: [source.expert.challenge.v1], method: immutable-incident-freeze, denominator_policy: 逐案例报告退化状态}
limitations: [样本量与统计功效由后续测量设计确认, 本计划不产生 trial 或 Metric, 抽样框外总体不在结论范围]
