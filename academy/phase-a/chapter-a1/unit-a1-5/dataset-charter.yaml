schema_version: 1
kind: DatasetCharter
metadata: {id: dataset-charter.example.v1, name: 评测数据章程模板, owner: evaluation-data-owner, version: 1.0.0}
traceability:
  target_ids: [target.example]
  construct_ids: [construct.example]
  question_ids: [eq.example]
  risk_ids: [risk.example]
  scenario_family_ids: [family.normal, family.challenge, family.regression]
  task_ids: [task.example.v1]
purpose:
  decision_supported: 为声明任务和风险准备可审计的评测数据输入
  intended_use: 构造后续 trial 的输入、参考标准、切片与回归资产
  prohibited_uses: [直接证明系统通过门禁, 估计未声明总体, 训练候选系统后继续作为独立门禁集]
target_population:
  definition: 声明用户、任务、权限、业务状态和时间范围内所有符合条件的任务机会
  inclusion: [属于声明 target 与 claim boundary, 可映射到已定义 Task Spec, 具备合法数据处理依据]
  exclusion: [超出声明语言或业务域, 无授权且无法安全去标识, 无法确认任务与实体边界]
  time_window: {start: "YYYY-MM-DD", end: "YYYY-MM-DD", timezone: UTC}
unit_of_analysis:
  primary: 一次可独立实例化的任务机会
  parent_unit: 业务实体或文档族
  repeated_measure_key: entity-or-document-id
  dependence_note: 同一父实体、文档模板或时间链上的记录不是独立样本
sampling_frame:
  definition: 在目标时间窗内可枚举且有授权的任务机会登记表
  frame_id: frame.example.snapshot.v1
  coverage_limitations: [离线记录可能漏掉未完成请求, 高风险低频事件需要定向补充]
partitions:
  - id: partition.distribution
    role: distribution
    question_ids: [eq.example]
    risk_ids: [risk.example]
    population_relation: 按目标总体抽样并保留自然分母
    allowed_claim: 仅在抽样与统计设计支持时描述声明总体中的表现
  - id: partition.challenge
    role: challenge
    question_ids: [eq.example]
    risk_ids: [risk.example]
    population_relation: 富集边界、异常、对抗和高严重性低频场景
    allowed_claim: 用于发现失败与关键风险门禁，不估计自然发生率
  - id: partition.regression
    role: regression
    question_ids: [eq.example]
    risk_ids: [risk.example]
    population_relation: 固化已确认事故、缺陷和重要边界的不可变复现集
    allowed_claim: 用于检测已知行为退化，不代表总体分布
scope_controls:
  partition_denominators_separate: true
  protected_evaluation_data: required
  training_contamination_policy: 一旦用于训练、提示调优或人工定向修复即退出独立门禁集并登记替代版本
evidence_boundary:
  establishes: [数据目的、总体、分析单位、抽样框与分区语义]
  does_not_establish: [任何 trial 已运行, Scorer 已实现或校准, Metric 已计算, Gate 已通过, 生产效果或个人能力]
