schema_version: 1
kind: DatasetManifest
metadata: {id: dataset.example.v1, name: 不可变评测数据版本清单模板, owner: evaluation-data-owner, version: 1.0.0}
dataset_charter_id: dataset-charter.example.v1
source_register_id: source-register.example.v1
sampling_plan_id: sampling-plan.example.v1
reference_standard_id: reference-standard.example.v1
annotation_protocol_id: annotation-protocol.example.v1
split_manifest_id: split-manifest.example.v1
traceability: {target_ids: [target.example], construct_ids: [construct.example], question_ids: [eq.example], risk_ids: [risk.example], scenario_family_ids: [family.normal, family.challenge, family.regression], task_ids: [task.example.v1], partition_ids: [partition.distribution, partition.challenge, partition.regression], source_ids: [source.traffic.snapshot.v1, source.expert.challenge.v1], reference_item_ids: [reference.example.normal.v1], split_ids: [split.development, split.gate, split.regression]}
dataset_identity:
  immutable_id: dataset.example.v1
  created_at: "YYYY-MM-DDTHH:MM:SSZ"
  content_hash: sha256:declared-after-materialization
  schema_hash: sha256:declared-schema-hash
  parent_version: none
  status: candidate
contents:
  - {id: content.items, path: data/items.jsonl, media_type: application/x-ndjson, hash: sha256:declared, record_role: task-items}
  - {id: content.references, path: data/references.jsonl, media_type: application/x-ndjson, hash: sha256:declared, record_role: references-and-annotations}
  - {id: content.assignments, path: data/splits.jsonl, media_type: application/x-ndjson, hash: sha256:declared, record_role: split-assignments}
item_schema:
  required: [item_id, target_id, question_ids, risk_ids, task_id, scenario_family_id, partition_id, source_id, source_record_id, parent_id, entity_id, document_family_id, template_id, event_time, input_fixture, reference_item_id, split_id]
  sensitive_fields: [source_record_id, entity_id, input_fixture]
  identity_rule: item_id 由规范化内容、状态和来源版本生成，展示名不参与身份
joins:
  - {from: item.source_id, to: source-register.sources.id, cardinality: many-to-one, orphan_allowed: false}
  - {from: item.reference_item_id, to: reference-standard.reference_items.id, cardinality: many-to-one, orphan_allowed: false}
  - {from: item.split_id, to: split-manifest.splits.id, cardinality: many-to-one, orphan_allowed: false}
views:
  target: {allowed_fields: [item_id, target_id, task_id, scenario_family_id, input_fixture], prohibited_fields: [reference_item_id, reference, annotation, expected, split_id], reference_access: false}
  harness: {allowed_fields: [item_id, target_id, task_id, scenario_family_id, input_fixture, split_id], prohibited_fields: [reference_item_id, reference, annotation, expected], reference_access: false}
  scorer: {allowed_fields: [item_id, target_id, task_id, candidate_observations, reference_item_id, adjudicated_labels, required_evidence_links], prohibited_fields: [source_record_id, annotator_identity, unrelated_sensitive_fields], reference_access: true}
  audit: {allowed_fields: [all-governed-fields-with-purpose-bound-access], prohibited_fields: [raw-secret-or-credential, fields-without-audit-purpose], reference_access: true}
partition_summary:
  - {partition_id: partition.distribution, role: distribution, count: materialized-count, denominator: natural-frame, reporting: separate}
  - {partition_id: partition.challenge, role: challenge, count: materialized-count, denominator: risk-directed, reporting: separate}
  - {partition_id: partition.regression, role: regression, count: materialized-count, denominator: case-family, reporting: per-case}
provenance_summary: {all_sources_registered: required, all_transformations_versioned: required, authorization_current_at_creation: required, privacy_review_id: review.example.v1}
versioning:
  immutable: true
  mutation_policy: 不原地改写；内容、标签、split、参考标准或授权变化均生成新 immutable_id
  supersession: {supersedes: none, superseded_by: none, compatibility: new-evaluation-required}
drift_and_refresh:
  monitors: [target-population-composition, scenario-and-risk-incidents, source-schema, policy-and-reference, annotation-disagreement, privacy-and-authorization]
  triggers: [population-shift, new-critical-risk, policy-or-ACL-change, source-schema-change, annotation-drift, authorization-expiry]
  refresh_process: 重新登记来源、重算抽样框、按同一泄漏边界切分、重标受影响项、发布新版本并保留旧版本
  comparison: 新旧版本分开运行并报告构成变化；不得把版本差异归因于系统性能而不做分析
evidence_boundary: {establishes: [数据身份、组成、来源、参考、标注和 split 的可追踪关系], does_not_establish: [数据科学效度自动成立, trial 已运行, scorer 或 metric 已产生, gate 已通过]}
limitations: [模板中的 hash 与 count 在物化时填写, 候选状态不等于数据 ready, 数据版本不能代表候选系统版本]
