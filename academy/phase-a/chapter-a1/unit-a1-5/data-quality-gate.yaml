schema_version: 1
kind: DataQualityGate
metadata: {id: data-quality-gate.example.v1, name: 评测数据质量门模板, owner: evaluation-governance-owner, version: 1.0.0}
dataset_manifest_id: dataset.example.v1
traceability: {question_ids: [eq.example], risk_ids: [risk.example], task_ids: [task.example.v1], source_ids: [source.traffic.snapshot.v1, source.expert.challenge.v1], split_ids: [split.development, split.gate, split.regression]}
status_values:
  ready: 所有关键检查有有效证据，数据仅可进入声明的后续 trial 准备
  partial: 非关键切片或改进项未完成，只有明确隔离且充分的子范围可继续
  blocked: 关键证据缺失或依赖未完成，停止进入 trial
  invalid: 授权、身份、血缘、参考标准或泄漏出现不可接受缺陷，当前版本不得使用
check_status_values: {passed: 有效语义证据满足该检查, partial: 只满足可隔离子范围, blocked: 缺少完成检查所需证据, failed: 已确认违反要求}
checks:
  - {id: check.charter, category: scope, critical: true, requirement: 总体、单位、抽样框和分区用途完整且可追踪, evidence: {semantic_basis: 章程语义字段完整且逐项连接问题风险任务, evidence_links: [dataset-charter.example.v1], sample_count_only: false}, status: blocked, failure_action: 补齐章程并重新评审, owner: evaluation-data-owner}
  - {id: check.provenance, category: governance, critical: true, requirement: 所有来源具备 provenance、lineage、授权、隐私、许可和保留规则, evidence: {semantic_basis: 每项来源的权利与变换链可回放审计, evidence_links: [source-register.example.v1], sample_count_only: false}, status: blocked, failure_action: 冻结未闭合来源及派生项, owner: data-steward}
  - {id: check.sampling, category: representation, critical: true, requirement: distribution、challenge、regression 的选择与分母分离, evidence: {semantic_basis: 分区用途抽样方法与分母独立，gap 有责任动作, evidence_links: [sampling-plan.example.v1], sample_count_only: false}, status: blocked, failure_action: 修复抽样与分区后重建版本, owner: evaluation-data-owner}
  - {id: check.reference, category: validity, critical: true, requirement: 权威材料、oracle、不变量与不确定性处理完整, evidence: {semantic_basis: 每个关键风险具有来源支持的 oracle 或 invariant, evidence_links: [reference-standard.example.v1], sample_count_only: false}, status: blocked, failure_action: 补证或将受影响范围标为 blocked, owner: domain-standard-owner}
  - {id: check.annotation, category: labeling, critical: true, requirement: 独立盲标、原始分歧、仲裁和证据链接可审计, evidence: {semantic_basis: 盲法、原始标签、分歧类型与独立仲裁均可审计, evidence_links: [annotation-protocol.example.v1], sample_count_only: false}, status: blocked, failure_action: 暂停批次并重新标注, owner: annotation-lead}
  - {id: check.leakage, category: independence, critical: true, requirement: parent、entity、document、template 和 time 边界无跨 split 泄漏, evidence: {semantic_basis: 五类依赖先成组再分配且生成碰撞报告, evidence_links: [split-manifest.example.v1], sample_count_only: false}, status: blocked, failure_action: 当前版本 invalid 并重切分, owner: independent-data-reviewer}
  - {id: check.version, category: reproducibility, critical: true, requirement: 内容、schema、来源、参考和 split 均锁定不可变身份, evidence: {semantic_basis: 数据内容、schema 与所有组成资产可按 hash 重建, evidence_links: [dataset.example.v1], sample_count_only: false}, status: blocked, failure_action: 完成物化 hash 后发布新版本, owner: evaluation-data-owner}
  - {id: check.drift, category: maintenance, critical: false, requirement: 漂移监控、刷新触发和旧版本保留策略明确, evidence: {semantic_basis: 漂移信号、触发器、刷新与版本比较均有责任边界, evidence_links: [dataset.example.v1], sample_count_only: false}, status: partial, failure_action: 限制有效期并指定刷新责任人, owner: data-steward}
decision:
  status: blocked
  blocking_check_ids: [check.charter, check.provenance, check.sampling, check.reference, check.annotation, check.leakage, check.version]
  partial_check_ids: [check.drift]
  invalidating_check_ids: []
  reason: 数据资产尚未物化，关键来源、标注、泄漏审计与不可变版本证据均未完成
  owner: evaluation-data-owner
  action: 完成各阻断检查的实际证据并由独立数据审查者重新判定
  allowed_next_step: 仅可继续补齐和审查数据资产，不得调度真实 trial
  prohibited_claims: [数据已 ready, 系统已被评测, Scorer 或 Metric 已产生, Gate 已通过, 生产性能或个人能力已证明]
exceptions:
  allowed: false
  rationale: 授权、隐私、参考标准和 split 独立性等关键缺陷不可用平均质量补偿
limitations: [模板初始 blocked 是诚实的未物化状态, ready 只表示数据准备资格, DataQualityGate 不是系统发布 Gate]
