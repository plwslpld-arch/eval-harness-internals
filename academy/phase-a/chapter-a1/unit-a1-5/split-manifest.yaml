schema_version: 1
kind: SplitManifest
metadata: {id: split-manifest.example.v1, name: 数据切分与泄漏控制模板, owner: evaluation-data-owner, version: 1.0.0}
dataset_charter_id: dataset-charter.example.v1
sampling_plan_id: sampling-plan.example.v1
source_register_id: source-register.example.v1
traceability: {risk_ids: [risk.example], task_ids: [task.example.v1], partition_ids: [partition.distribution, partition.challenge, partition.regression]}
split_policy:
  principle: 先按所有依赖与泄漏边界形成不可拆组，再把组分配到 split；不得先按行随机切分后补救
  assignment_seed: recorded-seed
  freeze_after_assignment: true
  contamination_action: 隔离污染组、使受影响结论无效、建立替代受保护集并生成新版本
grouping_keys:
  parent: parent_case_id
  entity: business_entity_id
  document: document_family_id
  template: generation_template_id
  time: event_or_effective_time_bucket
leakage_controls:
  - {id: leak.parent, boundary: parent, key: parent_case_id, rule: 父案例及所有变体进入同一 split, check: no-cross-split-parent, failure_action: invalid}
  - {id: leak.entity, boundary: entity, key: business_entity_id, rule: 同一订单、合同或身份实体不得跨训练与受保护评测, check: no-cross-split-entity, failure_action: invalid}
  - {id: leak.document, boundary: document, key: document_family_id, rule: 文档版本、附件、切块和派生问答按文档族隔离, check: no-cross-split-document-family, failure_action: invalid}
  - {id: leak.template, boundary: template, key: generation_template_id, rule: 同一生成模板及近重复表述不得跨开发与受保护评测, check: no-cross-split-template-or-near-duplicate, failure_action: blocked}
  - {id: leak.time, boundary: time, key: event_or_effective_time_bucket, rule: 回溯评测只使用截点前可得信息，未来标签和政策不得泄漏, check: no-future-information, failure_action: invalid}
splits:
  - {id: split.development, purpose: 数据工程、协议校准和调试, partition_roles: [distribution, challenge], source_ids: [source.traffic.snapshot.v1, source.expert.challenge.v1], time_window: declared-development-window, assignment_rule: grouped-hash-assignment, protected: false, allowed_use: [authoring, annotation-calibration, scorer-development]}
  - {id: split.gate, purpose: 后续独立门禁评测输入, partition_roles: [distribution, challenge], source_ids: [source.traffic.snapshot.v1, source.expert.challenge.v1], time_window: declared-gate-window, assignment_rule: grouped-hash-assignment-after-leakage-closure, protected: true, allowed_use: [future-trial-only]}
  - {id: split.regression, purpose: 已知事故与关键缺陷回归, partition_roles: [regression], source_ids: [source.expert.challenge.v1], time_window: versioned-incident-window, assignment_rule: immutable-case-family-freeze, protected: true, allowed_use: [future-regression-trial]}
assignment_audit: {required_outputs: [item-to-group-map, group-to-split-map, cross-split-collision-report, near-duplicate-report, temporal-cutoff-report], reviewer: independent-data-reviewer}
limitations: [split 结构不证明无模型预训练污染, 相同实体的未知别名仍需人工审查, 受保护不等于从未被访问]
