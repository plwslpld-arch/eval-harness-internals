schema_version: 1
kind: EvaluationCase
metadata: {id: study.contract.a15, name: 合同审查 Agent 评测数据案例, version: 1.0.0}
references:
  target_ids: [target.contract-agent.candidate]
  construct_ids: [construct.contract.critical-recall, construct.contract.span-grounding]
  question_ids: [eq.contract.screen]
  risk_ids: [risk.contract.omission, risk.contract.fabrication]
  scenario_family_ids: [family.contract.explicit, family.contract.cross, family.contract.missing]
  task_ids: [task.contract.screen]
  dataset_charter_ids: [charter.contract.a15]
  source_ids: [source.contract.licensed.v1, source.contract.expert.v1, source.contract.taxonomy.v1]
  partition_ids: [partition.contract.distribution, partition.contract.challenge, partition.contract.regression]
  reference_item_ids: [reference.contract.risk-span.v1, reference.contract.incomplete.v1]
  annotation_protocol_ids: [annotation.contract.v1]
  split_ids: [split.contract.development, split.contract.gate, split.contract.regression]
  dataset_version_ids: [dataset.contract.a15.v1]
  quality_gate_ids: [gate.contract.data.v1]
  trace_ids: [trace.contract.omission, trace.contract.fabrication]
input:
  charter:
    id: charter.contract.a15
    upstream_traceability:
      target_ids: [target.contract-agent.candidate]
      construct_ids: [construct.contract.critical-recall, construct.contract.span-grounding]
      question_ids: [eq.contract.screen]
      risk_ids: [risk.contract.omission, risk.contract.fabrication]
      scenario_family_ids: [family.contract.explicit, family.contract.cross, family.contract.missing]
      task_ids: [task.contract.screen]
    purpose: 为声明合同类型、语言和司法辖区的律师复核前首轮筛查准备评测数据
    target_population: 获许可的英文商业服务协议中，属于声明司法辖区并进入首轮风险筛查的合同任务机会
    unit_of_analysis: {primary: 一份合同的一次首轮筛查, parent: 合同交易包, repeated_measure: 同一合同、修订版、附件与模板族}
    sampling_frame: {id: frame.contract.licensed.v1, definition: 许可合同登记与合同类型、司法辖区、签署阶段元数据快照, exclusions: [未授权合同, 非英文合同, 未声明合同类型或司法辖区]}
    partitions:
      - {id: partition.contract.distribution, role: distribution, purpose: 保留声明合同类型、来源与条款表达构成, denominator: 许可抽样框中的合格合同}
      - {id: partition.contract.challenge, role: challenge, purpose: 富集跨条款、附件缺失、OCR 降级和困难负例, denominator: 风险定向案例，不表示生产频率}
      - {id: partition.contract.regression, role: regression, purpose: 固化经确认的关键漏检和伪造 span 缺陷, denominator: 不可变缺陷族}
    evidence_boundary: 数据可支持后续筛查 trial 设计；不能证明 Agent 已运行、达到律师水平或可替代律师
  sources:
    - id: source.contract.licensed.v1
      status: planned-not-materialized
      type: licensed-document-corpus
      purpose: distribution
      provenance: {producer: legal-operations, snapshot: not-materialized, extraction: planned-registry-export.v2}
      lineage: {parents: [frame.contract.licensed.v1], transforms: [remove-party-identifiers, preserve-clause-offsets, link-attachments], output: source.contract.licensed.v1}
      authorization: {owner: legal-data-owner, basis: license-verification-required-before-materialization, status: pending-verification, expires: "2027-01-31"}
      privacy: {classification: highly-confidential, handling: restricted-enclave-and-party-pseudonyms, forbidden_fields: [party-name, signature, bank-detail]}
      license_and_retention: {use: offline-legal-evaluation, access: named-legal-reviewers, redistribution: prohibited, retention_days: 180}
      limitations: [只覆盖声明合同类型和司法辖区, 历史协议可能偏向已签署文本]
    - id: source.contract.expert.v1
      status: planned-not-materialized
      type: expert-authored-variants-and-defects
      purpose: challenge-and-regression
      provenance: {producer: qualified-contract-lawyers, snapshot: not-materialized, extraction: planned-risk-and-incident-authoring}
      lineage: {parents: [risk.contract.omission, risk.contract.fabrication], transforms: [cross-clause-compose, remove-attachment, degrade-parse, author-hard-negative], output: source.contract.expert.v1}
      authorization: {owner: legal-quality-owner, basis: fixture-review-required-before-materialization, status: pending-verification, expires: "2027-06-30"}
      privacy: {classification: restricted, handling: synthetic-parties-and-reviewed-text, forbidden_fields: [client-source-text]}
      license_and_retention: {use: evaluation-only, access: legal-evaluation-team, redistribution: conditional, retention_days: 365}
      limitations: [模板化构造痕迹, 风险比例不代表真实合同总体]
    - id: source.contract.taxonomy.v1
      status: planned-not-materialized
      type: authoritative-taxonomy-and-rubric
      purpose: reference-standard
      provenance: {producer: legal-risk-committee, snapshot: planned-contract-risk-taxonomy.v8, extraction: planned-version-and-span-index}
      lineage: {parents: [approved-legal-guidance], transforms: [version-and-span-index], output: source.contract.taxonomy.v1}
      authorization: {owner: legal-risk-committee, basis: reference-approval-required, status: pending-verification, expires: "2027-01-31"}
      privacy: {classification: internal, handling: no-client-data, forbidden_fields: []}
      license_and_retention: {use: reference, access: legal-evaluation-team, redistribution: prohibited, retention_days: 365}
      limitations: [解释空间不能被 taxonomy 标签完全消除]
  sampling:
    population: 章程声明的合格合同筛查机会
    frame_id: frame.contract.licensed.v1
    sampling_frame:
      gaps:
        - {id: gap.contract.pre-signature, description: 抽样框中过度代表已签署协议，谈判中草案不足, affected_population_or_risk: 修订痕迹与附件尚未固定时的漏检风险, impact: 该子总体只能标记 partial, owner: legal-data-steward, action: 建立经许可的谈判草案来源并重新分层, status: gap}
        - {id: gap.contract.non-english, description: 非英文协议不在当前框, affected_population_or_risk: 多语言法律表达与 OCR 风险, impact: 明确排除且不得推广, owner: legal-product-owner, action: 扩展 claim boundary 前另建数据版本, status: blocked}
    strata:
      - {id: stratum.contract.type-risk, dimensions: [contract-type, jurisdiction, risk-category, expression-style], risk_ids: [risk.contract.omission]}
      - {id: stratum.contract.evidence, dimensions: [attachment-state, parse-quality, clause-span-count, true-negative-difficulty], risk_ids: [risk.contract.fabrication]}
    selection: {distribution: 按合同类型、司法辖区和风险类别分层概率抽样, challenge: 定向选择跨条款、缺附件、解析降级和困难负例, regression: 固化确认漏检与引用缺陷族}
    deduplication: 同交易包、合同修订链、附件、标准模板和近重复条款进入同一依赖簇
    allocation:
      rule: 关键风险语义优先，数量不能替代专家参考与泄漏检查
      per_stratum:
        - {stratum_id: stratum.contract.type-risk, target_count: 180, actual_count: 0, status: blocked, rationale: 仅定义声明合同类型与风险目标；许可合同和尚未补齐的谈判草案均未物化}
        - {stratum_id: stratum.contract.evidence, target_count: 60, actual_count: 0, status: blocked, rationale: 仅定义跨条款、附件、解析与困难负例目标；尚未物化}
  reference:
    standard_id: reference.contract.v1
    policy: 以有效 taxonomy、完整合同与附件原文、字符级 span、律师可接受替代解释和责任不变量共同构成参考
    items:
      - id: reference.contract.risk-span.v1
        task_ids: [task.contract.screen]
        risk_ids: [risk.contract.omission, risk.contract.fabrication]
        source_ids: [source.contract.licensed.v1, source.contract.taxonomy.v1]
        oracle_type: qualified-expert-set-valued-reference
        authoritative_material:
          - {id: material.contract.document-family.v1, version: v1, effective_at: "2026-08-10T00:00:00Z", span: 完整合同、附件及版本化字符偏移}
          - {id: material.contract.taxonomy.v8, version: v8, effective_at: "2026-08-10T00:00:00Z", span: 风险类别、严重性与适用示例}
        expected:
          required_outcomes: [关键类别与严重性均引用实际存在的单条或多条原文 span, 困难负例不因表面关键词虚构风险]
          prohibited_outcomes: [引用不存在或不支持结论的 span, 把解析降级误写成独立上游场景家族, 把候选输出当作参考]
          required_evidence: [material.contract.document-family.v1, material.contract.taxonomy.v8, invariant.contract.no-fabricated-span]
        acceptable_alternatives: [{condition: 多种法律解释均由现有材料合理支持, outcome: 保留多值参考与各自依据，不强压唯一标签, rationale: 合理专家分歧不等于唯一真值}]
        uncertainty_action: 标记 unresolved 并提交独立律师仲裁；无法定位原文时阻塞该 Reference
      - id: reference.contract.incomplete.v1
        task_ids: [task.contract.screen]
        risk_ids: [risk.contract.omission]
        source_ids: [source.contract.expert.v1, source.contract.taxonomy.v1]
        oracle_type: responsibility-invariant
        authoritative_material:
          - {id: material.contract.incomplete-fixture.v1, version: v1, effective_at: "2026-08-10T00:00:00Z", span: 附件缺失、解析降级与伪造 span 的设计状态}
          - {id: material.contract.taxonomy-responsibility.v8, version: v8, effective_at: "2026-08-10T00:00:00Z", span: 上下文不足、升级和律师责任边界}
        expected:
          required_outcomes: [附件缺失归入 missing 家族并升级, 解析降级或疑似伪造归入 explicit 或 missing 的材料语义且不得伪造 span, 输出仅作律师复核候选]
          prohibited_outcomes: [把 degraded 当作 A1.4 场景家族, 缺失材料时给出最终法律意见, 无实际原文时制造 span]
          required_evidence: [material.contract.incomplete-fixture.v1, material.contract.taxonomy-responsibility.v8, invariant.contract.no-fabricated-span, invariant.contract.lawyer-responsibility]
        acceptable_alternatives: [{condition: 专家仍无法从现有材料判定, outcome: unresolved 并说明缺失材料, rationale: 不完整材料不能支持确定性法律判断}]
        uncertainty_action: 请求原件或缺失附件并升级；材料未补齐前保持 blocked
    invariants:
      - {id: invariant.contract.no-fabricated-span, risk_ids: [risk.contract.fabrication, risk.contract.omission], assertion: "每个关键候选必须链接到实际存在的版本化原文", observation_required: [合同版本, 字符级 span, span 与风险结论的支持关系]}
      - {id: invariant.contract.lawyer-responsibility, risk_ids: [risk.contract.omission], assertion: "系统输出仅为复核候选，不得作为最终法律意见", observation_required: [输出责任声明, 缺失上下文, 律师升级记录]}
    uncertainty: 专家独立给出多值参考；材料缺失、管辖解释冲突或无法定位时进入仲裁或 blocked
  annotation:
    protocol_id: annotation.contract.v1
    units: [{id: unit.contract.document, level: contract-screening-opportunity, fields: [risk-category, severity, supporting-spans, missing-context, permissible-alternatives]}]
    labels: [{id: label.contract.risk, values: [critical, high, medium, none, unresolved], evidence: [taxonomy-version, source-span]}, {id: label.contract.context, values: [complete, attachment-missing, parse-degraded, conflicting], evidence: [document-and-parser-state]}]
    blind_independent: {annotators: 2, blind_to: [candidate-output, other-label, split-destination], qualification: declared-jurisdiction-contract-lawyer}
    disagreement: {preserve_raw: true, categories: [legal-interpretation, span-scope, taxonomy-fit, missing-context, clerical], critical_action: mandatory-arbitration}
    arbitration: {role: senior-lawyer-without-original-label, method: 复核两份独立意见、taxonomy 和完整原文，不以多数票抹平合理分歧, outputs: [set-valued-reference, rationale, spans, protocol-or-taxonomy-action]}
  split:
    manifest_id: split.contract.v1
    grouping: {parent: parent_case_id, entity: transaction-package-id, document: contract-revision-and-attachment-family, template: standard-clause-or-generation-template, time: negotiation-and-taxonomy-effective-window}
    leakage_controls: [{boundary: parent, rule: 原始合同与所有挑战变体同 split}, {boundary: entity, rule: 同一交易包不跨 development 与 gate}, {boundary: document, rule: 修订版、附件、切块和问答同族隔离}, {boundary: template, rule: 标准模板和近重复条款不跨 split}, {boundary: time, rule: 截点后修订与律师结论不进入回溯输入}]
    splits: [{id: split.contract.development, purpose: 协议和 Scorer 后续开发, protected: false, partitions: [distribution, challenge]}, {id: split.contract.gate, purpose: 后续独立筛查 trial, protected: true, partitions: [distribution, challenge]}, {id: split.contract.regression, purpose: 关键漏检与伪造 span 回归, protected: true, partitions: [regression]}]
  dataset_version:
    id: dataset.contract.a15.v1
    identity: {content_hash: not-materialized, schema_hash: not-materialized, created_at: pending-materialization, immutable: true, status: design-only}
    contents: [{id: contract-items, role: planned-licensed-task-items, hash: not-materialized}, {id: contract-references, role: planned-raw-and-adjudicated-expert-references, hash: not-materialized}, {id: contract-splits, role: planned-dependency-safe-assignments, hash: not-materialized}]
    views: {target: {allowed_fields: [item_id, task_id, document-fixture], prohibited_fields: [reference, annotation, expected, reference_item_id], reference_access: false}, harness: {allowed_fields: [item_id, target_id, task_id, document-fixture, split_id], prohibited_fields: [reference, annotation, expected, reference_item_id], reference_access: false}, scorer: {allowed_fields: [item_id, candidate-risk-spans, reference_item_id, adjudicated-expert-labels], prohibited_fields: [transaction_pseudonym, annotator_identity], reference_access: true}, audit: {allowed_fields: [all-governed-contract-fields], prohibited_fields: [raw-client-identifiers, fields-without-audit-purpose], reference_access: true}}
    item_schema: [item_id, transaction_pseudonym, target_id, task_id, risk_ids, scenario_family_id, source_id, contract_family_id, attachment_family_ids, template_id, event_time, taxonomy_version, reference_item_id, partition_id, split_id]
    drift_and_refresh: {monitors: [contract-type-mix, clause-language, new-risk-category, taxonomy-and-law-change, expert-disagreement], triggers: [material-law-or-taxonomy-change, new-contract-type, critical-miss, license-expiry], action: 新建不可变版本并重标受影响项，旧版本不覆盖}
  quality_gate:
    id: gate.contract.data.v1
    status_values: {ready: 数据可进入声明 trial 准备, partial: 仅充分且隔离的子范围可继续, blocked: 关键证据不足, invalid: 授权血缘参考或泄漏使版本不可用}
    checks:
      - {id: contract.check.scope, requirement: 总体单位抽样框三分区与 A1.4 上游绑定闭合, evidence: {semantic_basis: explicit、cross、missing 三家族及总体和分区设计闭合，谈判草案 gap 已声明, evidence_links: [charter.contract.a15, gap.contract.pre-signature], sample_count_only: false}, status: passed}
      - {id: contract.check.source, requirement: 许可血缘授权隐私完成物化审计, evidence: {semantic_basis: 三类来源治理字段已定义，但许可、快照与授权尚未物化核验, evidence_links: [source.contract.licensed.v1, source.contract.expert.v1, source.contract.taxonomy.v1], sample_count_only: false}, status: blocked}
      - {id: contract.check.reference, requirement: 专家多值 Reference 实例、span 与责任不变量完成, evidence: {semantic_basis: Reference 结构和权威材料要求已定义，但尚无文档实例与专家 Reference, evidence_links: [reference.contract.risk-span.v1, reference.contract.incomplete.v1], sample_count_only: false}, status: blocked}
      - {id: contract.check.annotation, requirement: 独立盲标原始分歧仲裁完整, evidence: {semantic_basis: 双律师盲标和独立仲裁流程已定义，但尚无 raw labels 或 adjudication 记录, evidence_links: [annotation.contract.v1], sample_count_only: false}, status: blocked}
      - {id: contract.check.leakage, requirement: 五类边界完成碰撞和时间审计, evidence: {semantic_basis: 交易包修订附件模板与时间分组规则已定义，但尚无 collision 或 temporal audit 报告, evidence_links: [split.contract.v1], sample_count_only: false}, status: blocked}
      - {id: contract.check.coverage, requirement: 样本与关键风险机制完成物化, evidence: {semantic_basis: 目标配额已定义但 actual_count 为零，谈判草案仍缺失, evidence_links: [charter.contract.a15, gap.contract.pre-signature], sample_count_only: false}, status: blocked}
      - {id: contract.check.version, requirement: 发布可复算不可变内容与 schema hash, evidence: {semantic_basis: 版本与视图设计已定义，但内容、schema 和 split hash 尚未物化, evidence_links: [dataset.contract.a15.v1], sample_count_only: false}, status: blocked}
    decision:
      status: blocked
      blocking_check_ids: [contract.check.source, contract.check.reference, contract.check.annotation, contract.check.leakage, contract.check.coverage, contract.check.version]
      partial_check_ids: []
      invalidating_check_ids: []
      reason: 许可样本、Reference、原始标注、仲裁、切分审计与内容 hash 均未物化
      owner: legal-data-steward
      action: 核验许可并物化三类来源和样本，完成律师 Reference 与独立盲标仲裁，生成碰撞和时间审计并发布不可变 hash 后重跑数据门
      allowed_next_step: 仅可继续物化和审查合同数据资产；达到 ready 后才可准备 future trial
      prohibited_claims: [已有真实合同数据或专家标注, 已生成泄漏审计报告, 数据已 ready, 合同 Agent 已运行或达到律师水平, 风险召回率已计算, 可调度 trial, 系统 Gate 已通过]
expected:
  trace_closure:
    - {id: trace.contract.omission, links: [target.contract-agent.candidate, construct.contract.critical-recall, eq.contract.screen, risk.contract.omission, family.contract.explicit, family.contract.cross, family.contract.missing, task.contract.screen, charter.contract.a15, source.contract.licensed.v1, source.contract.expert.v1, partition.contract.distribution, partition.contract.challenge, reference.contract.risk-span.v1, reference.contract.incomplete.v1, annotation.contract.v1, split.contract.development, split.contract.gate, dataset.contract.a15.v1, gate.contract.data.v1, contract.check.reference], action: 关键类别无专家参考则 blocked；许可无效或泄漏则 invalid}
    - {id: trace.contract.fabrication, links: [target.contract-agent.candidate, construct.contract.span-grounding, eq.contract.screen, risk.contract.fabrication, family.contract.explicit, family.contract.missing, task.contract.screen, charter.contract.a15, source.contract.taxonomy.v1, partition.contract.challenge, partition.contract.regression, reference.contract.risk-span.v1, reference.contract.incomplete.v1, invariant.contract.no-fabricated-span, annotation.contract.v1, split.contract.regression, dataset.contract.a15.v1, gate.contract.data.v1, contract.check.source, contract.check.annotation, contract.check.leakage, contract.check.coverage, contract.check.version], action: 解析降级或疑似伪造时按 explicit 或 missing 的准确材料语义处理；原文不可定位则不得确定标注}
  next_actions: [物化许可样本并补充谈判草案来源, 完成 Reference 实例、raw labels、独立仲裁、碰撞与 temporal audit 以及不可变 hash, 数据门达到 ready 后才可准备 future trial, 后续单元独立实现 Scorer、Harness、Metric 与系统 Gate]
evidence:
  design_artifacts: [charter.contract.a15, source.contract.licensed.v1, source.contract.expert.v1, source.contract.taxonomy.v1, reference.contract.risk-span.v1, reference.contract.incomplete.v1, annotation.contract.v1, split.contract.v1, dataset.contract.a15.v1, gate.contract.data.v1]
  traceability: [trace.contract.omission, trace.contract.fabrication]
  limitations: [案例仅完成设计范围闭合且不披露真实合同, 不声称已有合同实例、专家标注、仲裁或泄漏报告, 当前数据门为 blocked, 未运行 Agent trial, 未校准 Scorer 或 Judge, 未计算 Metric, 未执行系统 Gate, 不证明法律替代能力、生产效果或个人能力]
