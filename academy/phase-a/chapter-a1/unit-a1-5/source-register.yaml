schema_version: 1
kind: SourceRegister
metadata: {id: source-register.example.v1, name: 数据来源与血缘登记模板, owner: data-steward, version: 1.0.0}
dataset_charter_id: dataset-charter.example.v1
traceability: {target_ids: [target.example], question_ids: [eq.example], risk_ids: [risk.example], partition_ids: [partition.distribution, partition.challenge, partition.regression]}
sources:
  - id: source.traffic.snapshot.v1
    name: 已授权去标识历史任务快照
    type: observed-traffic
    purpose: distribution 分层抽样与真实表达覆盖
    partition_ids: [partition.distribution]
    provenance: {producer: declared-system, collection_method: versioned-export, collected_at: "YYYY-MM-DDTHH:MM:SSZ", original_system: system-of-record}
    lineage: {parent_ids: [frame.example.snapshot.v1], transformations: [field-minimization, deterministic-pseudonymization], transform_version: transform.example.v1, output_snapshot: source.traffic.snapshot.v1}
    authorization: {basis: documented-purpose-and-owner-approval, owner: data-owner, approved_purposes: [offline-evaluation-data-preparation], expires_at: "YYYY-MM-DD"}
    privacy: {classification: confidential, personal_data: true, sensitive_fields: [declared-sensitive-field], deidentification: deterministic-pseudonymization, reidentification_risk_review: required}
    license_and_access: {license: internal-authorized-use, access_group: evaluation-data-team, redistribution: prohibited}
    retention: {period_days: 90, deletion_or_review: review-at-expiry, derived_data_policy: inherits-source-restrictions}
    quality_limitations: [只包含被记录请求, 可能漏掉放弃或线下流程, 不覆盖罕见故障]
  - id: source.expert.challenge.v1
    name: 领域专家风险定向构造集
    type: expert-authored
    purpose: challenge 与 regression 的边界、事故和不可补偿风险覆盖
    partition_ids: [partition.challenge, partition.regression]
    provenance: {producer: qualified-domain-reviewers, collection_method: risk_to_scenario_authoring, collected_at: "YYYY-MM-DDTHH:MM:SSZ", original_system: controlled-authoring-workspace}
    lineage: {parent_ids: [risk.example, family.challenge, family.regression], transformations: [deidentify-source-material, instantiate-task-fixture], transform_version: authoring.example.v1, output_snapshot: source.expert.challenge.v1}
    authorization: {basis: original-or-licensed-material-only, owner: domain-owner, approved_purposes: [offline-evaluation-data-preparation], expires_at: "YYYY-MM-DD"}
    privacy: {classification: restricted, personal_data: true, sensitive_fields: [source-document-content], deidentification: expert-redaction-review, reidentification_risk_review: required}
    license_and_access: {license: declared-per-item, access_group: named-reviewers, redistribution: conditional}
    retention: {period_days: 365, deletion_or_review: annual-review, derived_data_policy: preserve-license-and-provenance}
    quality_limitations: [风险富集不代表生产频率, 专家构造可能带有模板痕迹]
source_governance:
  required_before_use: [owner-approval-current, provenance-complete, lineage-replayable, privacy-review-complete, license-compatible]
  forbidden: [来源不明抓取, 无目的复用个人数据, 用展示名替代不可变快照, 删除上游限制后再分发]
  incident_action: 冻结受影响来源及其所有派生版本，完成范围识别、通知、删除或重新授权
