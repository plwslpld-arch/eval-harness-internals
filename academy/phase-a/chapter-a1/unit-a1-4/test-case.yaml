schema_version: 1
kind: TestCase
metadata: {id: case.example.boundary.v1, name: 任务实例模板, owner: evaluation-owner, version: 1.0.0}
scenario_space_id: scenario-space.example.v1
task_spec_id: task.example.v1
target_id: target.example
construct_ids: [construct.example]
oracle_policy: {source: 版本化任务成功合同与环境状态断言, uncertainty: 证据不足标记 inconclusive, scorer_boundary: 本模板只声明预期不实现评分器}
cases:
  - id: case.example.normal.v1
    target_id: target.example
    construct_ids: [construct.example]
    task_id: task.example.v1
    risk_ids: [risk.example]
    variant_ids: [variant.example.controlled, variant.example.counterfactual, variant.example.invariant]
    scenario_family_id: family.normal
    scenario_coordinates: {actor: authorized, input: complete, state: initial, dependency: healthy, time: before_boundary}
    fixture: {id: fixture.example.normal.v1, version: immutable-version, initial_state: declared-normal-state}
    input: {request: representative-request, context: complete-context}
    initial_state: {fixture_id: fixture.example.normal.v1, business_state: initial, clock: fixed}
    stimulus: {request: representative-request, context: complete-context}
    expected: {outcome: expected-normal-result, final_state: expected-normal-state, must_not_occur: [prohibited-side-effect]}
    evidence_ids: [evidence.example.output, evidence.example.state]
    sample_role: representative
    status: implemented
  - id: case.example.boundary.v1
    target_id: target.example
    construct_ids: [construct.example]
    task_id: task.example.v1
    risk_ids: [risk.example]
    variant_ids: [variant.example.metamorphic]
    scenario_family_id: family.boundary-failure
    scenario_coordinates: {actor: authorized, input: complete, state: unknown, dependency: timeout, time: at_boundary}
    fixture: {id: fixture.example.v1, version: immutable-version, initial_state: declared-state}
    input: {request: concrete-request, context: concrete-context}
    initial_state: {fixture_id: fixture.example.v1, business_state: declared-state, clock: fixed}
    stimulus: {request: concrete-request, context: concrete-context}
    expected: {outcome: concrete-observable-result, final_state: concrete-state-assertion, must_not_occur: [prohibited-side-effect]}
    evidence_ids: [evidence.example.output, evidence.example.trajectory, evidence.example.state]
    sample_role: risk_boundary
    status: implemented
