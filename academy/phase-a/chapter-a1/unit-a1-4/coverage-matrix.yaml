schema_version: 1
kind: CoverageMatrix
metadata: {id: coverage.example.v1, name: 风险与场景覆盖矩阵模板, owner: evaluation-owner, version: 1.0.0}
scenario_space_id: scenario-space.example.v1
task_spec_id: task.example.v1
test_case_id: case.example.boundary.v1
variant_plan_id: variant.example.v1
trajectory_contract_id: trajectory.example.v1
target_id: target.example
construct_ids: [construct.example]
status_values: {planned: 已设计未实现, implemented: 已实现未执行, executed: 已执行且证据有效, blocked: 因依赖或证据缺失无法执行, excluded: 明确排除并记录理由}
items:
  - id: coverage.example.normal
    target_id: target.example
    construct_ids: [construct.example]
    question_ids: [eq.example]
    risk_ids: [risk.example]
    task_ids: [task.example.v1]
    case_ids: [case.example.normal.v1]
    scenario_family_ids: [family.normal]
    variant_ids: [variant.example.controlled, variant.example.counterfactual, variant.example.invariant]
    transition_ids: [transition.observe, transition.act, transition.finalize]
    evidence_ids: [evidence.example.output, evidence.example.state]
    coverage_basis: {semantic_basis: 常规任务与三个受控关系共享同一目标状态语义, evidence_logic: [输出与最终状态共同支持常规结果, 受控变量差异按预期关系解释], sample_count_only: false}
    status: implemented
    claim: 设计资产已实现，但尚未产生执行证据
    limitation: 不声称任何 trial 已运行
  - id: coverage.example.failure
    target_id: target.example
    construct_ids: [construct.example]
    question_ids: [eq.example]
    risk_ids: [risk.example]
    task_ids: [task.example.v1]
    case_ids: [case.example.boundary.v1]
    scenario_family_ids: [family.boundary-failure]
    variant_ids: [variant.example.metamorphic]
    transition_ids: [transition.recover]
    evidence_ids: [evidence.example.trajectory, evidence.example.state]
    coverage_basis: {semantic_basis: 状态未知与超时边界通过恢复轨迹和最终状态验证, evidence_logic: [先观察恢复动作顺序, 再断言无禁止副作用和正确最终状态], sample_count_only: false}
    status: implemented
    claim: 故障场景设计已实现，但尚未产生执行证据
    limitation: 不声称恢复语义已通过真实运行
gates:
  critical_risks: 必须至少有边界、故障和恢复场景达到 executed
  blocked_cells: 禁止声称已覆盖，必须给出责任人和补齐动作
  denominator_separation: 代表性样本与风险定向样本分开统计
review: {orphan_risks_allowed: false, orphan_cases_allowed: false, unexplained_critical_gaps_allowed: false}
coverage_claims: [当前仅为模板级 implemented 结构示例，不代表真实执行覆盖, critical 风险必须由有效任务和证据支持]
limitations: [sample_count 不能单独构成 covered, planned 或 implemented 不等于已执行证据]
