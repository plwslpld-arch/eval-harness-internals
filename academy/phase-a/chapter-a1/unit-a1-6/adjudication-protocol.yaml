schema_version: 1
kind: AdjudicationProtocol
metadata: {id: adjudication.example.v1, name: 评分分歧与仲裁协议模板, owner: adjudication-owner, version: 1.0.0}
rubric_id: rubric.example.v1
traceability: {risk_ids: [risk.example], reference_item_ids: [reference.example.v1], scoring_unit_ids: [unit.example.trial]}
disagreement:
  preserve_raw_decisions: true
  detection: status、维度分数、critical error、证据链接或理由任一不同
  categories: [reference-ambiguity, rubric-ambiguity, observation-missing, scorer-bug, domain-judgment, policy-conflict, clerical-error]
  outputs: [disagreement_id, raw_score_record_ids, category, severity, evidence_links]
workflow:
  - 冻结原始评分、版本与 Observation Bundle
  - 区分 scorer 错误、rubric 缺陷、Reference 冲突和真实领域分歧
  - 由独立且具资格的仲裁者只依据已授权证据复核
  - 保留原始判断，输出仲裁结果、理由、证据和资产修订动作
adjudicator: {qualification: independent-qualified-domain-reviewer, blind_to: [candidate-brand, release-preference], conflict_disclosure: required}
outcomes:
  values: [confirmed-score, corrected-score, set-valued-resolution, abstained, unscorable, inconclusive, protocol-defect]
  no_majority_rule: true
  no_forced_resolution: true
critical_failure_rule: 确定性关键失败的权威证据不得由 Judge 或多数票推翻；若证据本身冲突则标记 inconclusive 并调查证据链
feedback:
  actions: [fix-scorer, revise-rubric-version, revise-reference-version, recapture-observation, retrain-reviewers, quarantine-affected-scores]
  retrospective_rewrite_prohibited: true
evidence_boundary: {establishes: [分歧分类、独立仲裁和保留原始判断], does_not_establish: [已发生真实分歧, 已完成仲裁, scorer 已校准]}
