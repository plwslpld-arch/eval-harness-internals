schema_version: 1
kind: ScorerQualityGate
metadata: {id: scorer-quality-gate.example.v1, name: 评分器质量门模板, owner: evaluation-governance-owner, version: 1.0.0}
scorer_manifest_id: scorer-manifest.example.v1
validation_report_id: scorer-validation.example.v1
status_values:
  ready: 评分器在声明范围内具有独立、物化且达阈值的验证证据，可进入后续 trial 准备
  partial: 只有可隔离且验证充分的子范围可继续
  blocked: 关键实现或验证证据缺失，停止作为正式 scorer 使用
  invalid: 身份、权威、效度或安全存在不可接受缺陷，隔离该版本
required_check_categories: [reproducibility, safety, reliability, validity, calibration, error, robustness, security]
all_checks_critical: true
checks:
  - {id: check.identity, category: reproducibility, critical: true, requirement: 实现、配置、运行时和输入输出 schema 具有不可变身份, evidence: {materialized: false, semantic_basis: 只有设计字段，无实现 hash, evidence_links: [scorer-manifest.example.v1], planned_only: true}, status: blocked, failure_action: 实现并锁定身份后重新验证}
  - {id: check.precedence, category: safety, critical: true, requirement: 确定性关键失败不可被 Judge 覆盖或平均, evidence: {materialized: false, semantic_basis: 优先级规则已定义但尚未以反例执行验证, evidence_links: [scorer-manifest.example.v1], planned_only: true}, status: blocked, failure_action: 以 critical counterexamples 验证组合器}
  - {id: check.reliability, category: reliability, critical: true, requirement: 重测与评审者一致性达到预声明阈值, evidence: {materialized: false, semantic_basis: 无样本级重复判断记录, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 在独立校准集运行并保留记录}
  - {id: check.validity, category: validity, critical: true, requirement: 内容、准则与构念效度证据支持声明用途, evidence: {materialized: false, semantic_basis: 无独立领域审查或对照结果, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 完成效度研究或缩小声明范围}
  - {id: check.calibration, category: calibration, critical: true, requirement: 置信、阈值、abstain 与 unscorable 行为经过校准, evidence: {materialized: false, semantic_basis: 无校准曲线或阈值错误分析, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 完成校准并版本化阈值}
  - {id: check.error-profile, category: error, critical: true, requirement: false pass、false fail 和不可评分检测错误在容忍度内, evidence: {materialized: false, semantic_basis: 错误画像仅定义未观测, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 物化错误案例并审查关键 false pass}
  - {id: check.bias-robustness, category: robustness, critical: true, requirement: 关键切片、扰动和 Judge 偏差测试达标, evidence: {materialized: false, semantic_basis: 切片与扰动已列出但未执行, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 执行独立偏差和稳健性测试}
  - {id: check.security, category: security, critical: true, requirement: 注入、泄露、篡改、伪造与版本错配测试达标, evidence: {materialized: false, semantic_basis: 安全测试仅定义未执行, evidence_links: [scorer-validation.example.v1], planned_only: true}, status: blocked, failure_action: 隔离执行并修复所有关键缺陷}
decision:
  status: blocked
  blocking_check_ids: [check.identity, check.precedence, check.reliability, check.validity, check.calibration, check.error-profile, check.bias-robustness, check.security]
  partial_check_ids: []
  invalidating_check_ids: []
  partial_scope: null
  reason: Scorer 尚未实现，独立校准集、样本级记录和验证结果均未物化
  allowed_next_step: 仅可实现 scorer、物化独立校准证据并重跑本质量门；不得作为正式 scorer 调度 trial
  prohibited_claims: [scorer 已实现或可靠, 已产生真实 score, metric 已计算, Agent 已评测, Harness 已运行, 系统 Gate 已通过, 生产效果或个人能力已证明]
partial_scope_schema: {required_when: decision.status=partial, required: [id, allowed_uses, prohibited_uses, evidence_ids], evidence_rule: evidence_ids 必须解析到独立物化且与检查类别相容的验证证据}
ready_rule: 只有所有 critical checks 使用非 planned、可审计的独立物化证据并达到预声明阈值时才可 ready；定义、计划、空数组或自我声明均不合格
exceptions: {allowed: false, rationale: 关键身份、权威、效度和安全缺陷不可用其他维度平均补偿}
limitations: [ScorerQualityGate 只判断 scorer 是否有资格进入后续 trial 准备, 不是数据门、Metric 门或系统发布 Gate]
