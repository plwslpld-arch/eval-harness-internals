schema_version: 1
kind: ObservationContract
metadata: {id: observation-contract.example.v1, name: Observation Bundle 观察包合同模板, owner: evaluation-observability-owner, version: 1.0.0}
scoring_unit_spec_id: scoring-unit.example.v1
traceability: {target_ids: [target.example], risk_ids: [risk.example], task_ids: [task.example.v1], reference_item_ids: [reference.example.v1]}
bundle:
  identity:
    required: [observation_bundle_id, trial_id, task_id, dataset_item_id, target_identity, environment_identity, scorer_input_schema_version]
  initial_state:
    required: [fixture_identity, authority_snapshot_ids, permissions, effective_time]
  event_stream:
    required: [ordered_events, tool_calls, tool_results, state_transitions, timestamps]
    ordering: causal-order-preserved
  final_output:
    required: [content, atomic_claims, refusal_or_escalation, completion_status]
  final_state:
    required: [authoritative_state_snapshot, state_diff, unresolved_writes]
  evidence_metadata:
    required: [source_ids, reference_item_ids, hashes, capture_time, completeness_status, redaction_policy]
completeness:
  statuses: [complete, partial, missing, corrupted]
  critical_missing_action: unscorable
  partial_action: 仅在 rubric 明确允许且不影响关键风险时标记 uncertain，否则 unscorable
integrity:
  immutable_after_capture: true
  hashes_required: true
  clock_and_ordering_recorded: true
  candidate_cannot_write_reference_fields: true
privacy_and_access: {minimum_necessary: true, scorer_view_only: true, credentials_prohibited: true, access_logged: true}
evidence_boundary: {establishes: [未来评分所需观察字段、完整性和访问合同], does_not_establish: [观察已捕获, Harness 已实现, trial 已执行]}
