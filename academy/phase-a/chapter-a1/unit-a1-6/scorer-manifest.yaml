schema_version: 1
kind: ScorerManifest
metadata: {id: scorer-manifest.example.v1, name: 评分器身份与实现清单模板, owner: scorer-owner, version: 1.0.0}
scorer_charter_id: scorer-charter.example.v1
scoring_unit_spec_id: scoring-unit.example.v1
observation_contract_id: observation-contract.example.v1
rubric_id: rubric.example.v1
adjudication_protocol_id: adjudication.example.v1
traceability: {construct_ids: [construct.example], risk_ids: [risk.example], reference_item_ids: [reference.example.v1]}
scorer_identity:
  immutable_id: scorer.example.v1
  status: design-only
  implementation_hash: not-implemented
  config_hash: not-implemented
  runtime_identity: not-implemented
  input_schema_version: observation-contract.example.v1
  output_schema_version: score-record.v1
implementations:
  - {id: scorer.example.deterministic, type: deterministic, role: 检查权威状态和不可违反不变量, authority: primary-for-critical-state, status: planned}
  - {id: scorer.example.programmatic, type: programmatic, role: 比较 span、结构、集合和可执行条件, authority: primary-where-spec-exact, status: planned}
  - {id: scorer.example.human, type: human, role: 处理合格领域判断与多值参考, authority: domain-review, status: planned}
  - {id: scorer.example.judge, type: llm-as-judge, role: 在已校准范围内判断开放文本维度, authority: bounded-supporting, status: planned}
  - {id: scorer.example.composite, type: composite, role: 按权威顺序合并子评分器并执行不可补偿规则, authority: orchestrator-not-new-truth, status: planned}
precedence:
  order: [scorer.example.deterministic, scorer.example.programmatic, scorer.example.human, scorer.example.judge]
  conflict_rule: 关键确定性失败直接 force-fail；其他冲突进入 adjudication，不做无条件平均
  judge_cannot_override: [authoritative-state, executable-invariant, deterministic-critical-failure]
output_record:
  required: [score_record_id, scorer_immutable_id, implementation_id, observation_bundle_id, scoring_unit_id, rubric_id, reference_item_ids, status, dimension_scores, critical_errors, evidence_links, rationale, uncertainty, created_at]
  status_values: [scored, uncertain, abstained, unscorable, inconclusive]
failure_behavior: {missing_input: unscorable, unsupported_scope: abstained, internal_error: unscorable-and-alert, reference_conflict: inconclusive}
security: {reference_fields_read_only: true, candidate_output_untrusted: true, prompt_injection_treated_as_data: true, network_access: denied-unless-declared, secrets_prohibited: true, logs_redacted: true}
evidence_boundary: {establishes: [未来实现的不可变身份、类型、优先级、输出与失败合同], does_not_establish: [实现存在, scorer 被执行, score record 存在, 安全已验证]}
