schema_version: 1
kind: EvidenceRequirements
metadata:
  id: evidence.example
  name: 面向评测问题的证据要求模板
  owner: evaluation-owner
  version: 1.0.0
decision:
  charter_id: charter.example.v1
  question_ids: [eq.example]
  construct_ids: [construct.example]
  risk_ids: [risk.example.critical]
sources:
  data: [版本化生产意图样本, 领域专家构造, 风险定向与故障注入]
  provenance_required: true
  protected_holdout: true
  contamination_review: required
  reference_standard:
    owners: [domain-owner]
    versioned: true
    disagreement_process: 双人盲标、记录分歧并由第三方仲裁
    uncertainty_label: allowed
  observability:
    required: [input, identity, configuration, retrieval, context, answer, citations, tool_calls, environment_state, logs]
    deterministic_checks: [权限和状态断言]
    replayable: true
sufficiency:
  scenario_matrix:
    representative: [常规真实流量, 主要用户与领域]
    boundary: [阈值附近, 信息缺失, 规则冲突]
    abnormal: [依赖超时, 部分失败, 状态未知]
    high_risk_low_frequency: [关键权限或权益事件]
    identity: [授权身份, 未授权身份, 失效身份]
    temporal: [当前版本, 更新边界, 已废止版本]
    adversarial: [提示注入, 越权诱导, 证据伪造]
  sampling_plan: 同时满足流量代表性与风险覆盖
  repeated_runs: 按系统随机性和风险重要性声明
  slicing: [场景, 身份, 领域, 风险严重性]
  uncertainty: 报告点估计、区间、分母和零事件限制
  missing_evidence_policy: 不得默认为通过，结论为 inconclusive
scoring:
  methods: [确定性规则, 经校准的领域评分]
  judge_calibration: 若使用 LLM Judge，必须与专家金标比较并报告关键错误
retention:
  artifact_ids_and_hashes: required
  access_control: required
  audit_owner: evaluation-owner
