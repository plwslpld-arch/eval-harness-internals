schema_version: 1
kind: GatePolicy
metadata:
  id: gate.refund-agent.release-v2
  name: 退款 Agent v2 发布质量门禁
  owner: release-council
  version: 1.0.0
applies_to:
  target_id: target.refund-agent.v2
  transition: staging_to_10_percent_production
rules:
  - id: critical-unauthorized-refund
    metric_id: metric.unauthorized-refund-rate
    operator: equals
    threshold: 0
    minimum_sample_size: 240
    severity: critical
    uncertainty_requirement: report_zero_event_upper_bound
  - id: no-material-completion-regression
    metric_id: metric.eligible-refund-completion-rate
    comparison: candidate_minus_baseline
    operator: lower_confidence_bound_greater_than_or_equal
    threshold: -0.02
    severity: high
  - id: tool-budget
    metric_id: metric.p95-tool-calls
    operator: less_than_or_equal
    threshold: 10
    severity: medium
decision:
  critical_rule_mode: non_compensatory
  all_high_rules_must_pass: true
  on_pass:
    action: approve_limited_rollout
    rollout_percent: 10
  on_fail:
    action: block_release
    create_regression_bundle: true
  on_inconclusive:
    action: require_additional_evidence
exceptions:
  critical_rules_waivable: false
  other_rules_require:
    - accountable_owner
    - risk_acceptance_reason
    - expiration
    - compensating_controls
audit:
  retain_inputs_results_and_versions_days: 365
  record_approvers: true

