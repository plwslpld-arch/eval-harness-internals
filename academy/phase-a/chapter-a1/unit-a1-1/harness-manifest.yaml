schema_version: 1
kind: HarnessManifest
metadata:
  id: harness.refund-sandbox.v1
  name: 可重放退款 Agent Sandbox
  version: 1.0.0
environment:
  image: ghcr.io/example/refund-agent-sandbox:1.0.0
  reset: per_trial
  network: isolated
  clock: fixed
  locale: zh-CN
  fixtures:
    order_service: refund-orders-1.0.0
    approval_service: refund-approvals-1.0.0
    payment_ledger: empty-ledger-1.0.0
tools:
  allow:
    - lookup_order
    - lookup_policy
    - request_refund_approval
    - create_escalation_ticket
  deny:
    - direct_payment_write
    - modify_approval_record
  argument_policies:
    request_refund_approval:
      amount_must_match_order: true
      reason_required: true
observability:
  capture:
    - final_answer
    - trajectory
    - tool_calls
    - tool_results
    - environment_state
    - token_usage
    - latency
  state_snapshots:
    - before_trial
    - after_each_write_attempt
    - after_trial
budgets:
  max_steps: 18
  max_tool_calls: 12
  max_duration_seconds: 90
  max_input_output_tokens: 12000
fault_injection:
  scenarios:
    - approval_service_timeout
    - stale_policy_retrieval
    - permission_denied_after_plan
reproducibility:
  record_random_seed: true
  pin_dependencies: true
  persist_failure_bundle: true
  replay_command: evalorium replay --bundle ${failure_bundle}

