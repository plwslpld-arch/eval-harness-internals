schema_version: 1
kind: EvaluationCase
metadata: {id: case.contract-agent.target-boundary-version.v1, name: 合同审查 Agent 对象与边界案例, version: 1.0.0}
references:
  target_id: target.contract-agent.candidate
  boundary_id: boundary.contract-agent.candidate
  identity_id: identity.contract-agent.candidate
  runtime_state_id: runtime.contract-agent.release-suite
  reconciliation_id: reconciliation.contract-agent.release-suite
  reevaluation_policy_id: reevaluation.contract-agent.v1
input:
  original_requirement: 这个 Agent 要可靠，可以上线
  decision: 是否允许候选系统对声明合同类型、语言和司法辖区执行律师复核前的首轮风险筛查？
  target:
    id: target.contract-agent.candidate
    object_level: document_agent_workflow
    path: [文件接收, OCR与解析, 条款分段, 模型分析, 风险 taxonomy, 原文定位, 律师复核队列]
    claim_boundary: {users: [企业法务], contracts: [采购主协议, SaaS 协议, 数据处理附件], languages: [中文, 英文], jurisdictions: [声明辖区], purpose: 首轮辅助筛查}
  boundary:
    id: boundary.contract-agent.candidate
    system: [文件服务, OCR, 解析器, Agent, 模型, 风险规则, 复核队列]
    included: [Agent 代码, OCR与解析配置, 模型 revision, prompt, taxonomy, span 定位, 严重性策略]
    controlled: [去标识合同集, 解析夹具, 专家 rubric, 复核队列 Sandbox]
    external: [律师最终判断, 法律与监管变化]
    excluded: [签署批准, 最终法律意见, 未声明合同语言辖区]
    observation: [文件哈希, 解析文本, 模型配置, 风险候选, span, 解释, 不确定性, 升级状态]
  identity:
    id: identity.contract-agent.candidate
    immutable: [source_commit, image_digest, ocr_revision, parser_digest, model_revision, prompt_digest, taxonomy_digest, rubric_version, document_set_snapshot]
    deployment: {environment: isolated-evaluation, feature_flags: immutable-snapshot}
  runtime_state:
    id: runtime.contract-agent.release-suite
    initial: [合同文件哈希, 附件完整状态, 语言与辖区标签, 空复核队列]
    temporal: [rubric 生效日, taxonomy 版本时间]
    injected: [扫描质量下降, 附件缺失, 跨条款定义, 专家分歧]
    final_capture: [候选清单, span, 严重性, 升级队列, 资源消耗]
  reconciliation:
    id: reconciliation.contract-agent.release-suite
    checkpoints: [image_digest, ocr_revision, parser_digest, model_revision, prompt_digest, taxonomy_digest, rubric_version, document_set_snapshot]
    critical_mismatch_action: invalidate_run_and_rerun
  reevaluation_policy:
    id: reevaluation.contract-agent.v1
    targeted: {rubric_clarification: [受影响风险类别重标与重跑], parser_patch: [解析与 span 回归]}
    full: [模型或 OCR revision, taxonomy 变化, 新合同类型语言辖区, 最终责任扩大, 严重漏检事故]
expected:
  evidence_boundary: 证明该候选对声明合同总体执行首轮筛查的关键风险召回、原文定位和升级行为；不证明可替代律师
  reconciliation_result: 文档、解析、模型、taxonomy、rubric 与报告身份一致
  valid_claims: [声明类别风险筛查, 原文 span 可追踪, 上下文不足时升级]
  invalid_claims: [所有合同适用, 最终法律正确, 自动批准签署]
  decision_actions: {match_and_gate_pass: 批准首轮辅助范围, mismatch: inconclusive_and_rerun, critical_omission: fail_and_block, new_jurisdiction: reevaluate}
evidence:
  required: [target manifest, boundary map, identity attestation, document runtime snapshot, reconciliation report, 专家双盲与仲裁记录]
  assertions: [关键类别分别报告召回, 每个关键候选存在支持 span, 不作最终批准, 专家分歧单独报告]
  traceability:
    - claim: 声明合同总体的首轮筛查结论只属于已核对身份和运行态的候选对象
      links: [target.contract-agent.candidate, boundary.contract-agent.candidate, identity.contract-agent.candidate, runtime.contract-agent.release-suite, reconciliation.contract-agent.release-suite, reevaluation.contract-agent.v1]
      action: 任一关键引用不一致时结论为 inconclusive，并阻断继承或发布
  limitations: [法律更新和律师判断为 external, 不推广到未声明总体, 专家参考标准存在不确定性]
