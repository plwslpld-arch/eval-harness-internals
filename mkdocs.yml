site_name: Eval Harness 源码内核
site_description: 面向开发者的中文 Eval Harness 源码教材与可运行参考实现
site_url: https://plwslpld-arch.github.io/eval-harness-internals/
repo_url: https://github.com/plwslpld-arch/eval-harness-internals
repo_name: plwslpld-arch/eval-harness-internals
edit_uri: ""
copyright: 原创文档采用 CC BY 4.0；原创代码采用 MIT

theme:
  name: material
  language: zh
  logo: assets/brand/favicon.svg
  favicon: assets/brand/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: [zh, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 开始学习:
      - 学习入口: 00-start-here.md
      - 完整目录: contents.md
      - 学习路线: learning-paths.md
  - 基础篇:
      - Agent Harness 与 Eval Harness: foundations/01-agent-vs-eval-harness.md
      - Task、Dataset、Target 与 Environment: foundations/02-task-dataset-target-environment.md
      - Sample、Trial 与 Attempt: foundations/03-sample-trial-attempt.md
      - Trace、Artifact 与 Observation: foundations/04-trace-artifact-observation.md
      - Scorer、Judge、Score 与 Metric: foundations/05-scorer-judge-score-metric.md
      - 不确定性、比较与 Gate: foundations/06-uncertainty-comparison-gate.md
      - Eval-to-RL 与独立发布评测: foundations/07-eval-to-rl-and-release-eval.md
  - 源码课程:
      - lm-evaluation-harness:
          - 导读: harnesses/lm-evaluation-harness/README.md
          - 入口与 Task 加载: harnesses/lm-evaluation-harness/01-entry-task-loading.md
          - Request 与执行: harnesses/lm-evaluation-harness/02-request-execution.md
          - 评分、聚合与测试: harnesses/lm-evaluation-harness/03-scoring-aggregation-tests.md
      - Inspect AI:
