          - Eval、Task 与 Solver: harnesses/inspect-ai/01-eval-task-solver.md
          - Sandbox 与 Sample Run: harnesses/inspect-ai/02-sandbox-sample-run.md
          - Scorer、Log 与 Retry: harnesses/inspect-ai/03-scorer-log-retry.md
      - OpenAI Evals:
          - 导读: harnesses/openai-evals/README.md
          - Registry 与 EvalSpec: harnesses/openai-evals/01-registry-eval-spec.md
          - Completion 与 Sample Run: harnesses/openai-evals/02-completion-sample-run.md
          - Recorder、Metric 与边界: harnesses/openai-evals/03-recorder-metrics-boundaries.md
      - Promptfoo:
          - 导读: harnesses/promptfoo/README.md
          - 配置、Provider 与 Prompt: harnesses/promptfoo/01-config-provider-prompt.md
          - TestCase 与 Runtime: harnesses/promptfoo/02-test-case-runtime.md
          - Assertion、Result 与 CI: harnesses/promptfoo/03-assertion-results-ci.md
      - DeepEval:
          - 导读: harnesses/deepeval/README.md
          - Dataset、Golden 与 TestCase: harnesses/deepeval/01-dataset-golden-test-case.md
          - Metric 执行: harnesses/deepeval/02-metric-execution.md
          - 异步、缓存与错误: harnesses/deepeval/03-async-cache-errors.md
      - Harbor 与 Terminal-Bench 1:
          - 导读: harnesses/harbor-terminal-bench/README.md
          - Job、Dataset 与 Trial: harnesses/harbor-terminal-bench/01-job-dataset-trial.md
          - Environment 与 Agent 生命周期: harnesses/harbor-terminal-bench/02-environment-agent-lifecycle.md
          - Verifier、Reward 与 Result: harnesses/harbor-terminal-bench/03-verifier-reward-results.md
  - 工程篇:
      - 最小 Eval Loop: engineering/01-minimal-eval-loop.md
      - Run Identity 与可复现性: engineering/02-run-identity-and-reproducibility.md
      - Retry 与 Recovery: engineering/03-retries-and-recovery.md
      - LLM-as-a-Judge: engineering/04-llm-as-judge.md
      - 统计比较: engineering/05-statistical-comparison.md
      - Agent Environment: engineering/06-agent-environments.md
      - Quality Gate: engineering/07-quality-gates.md
      - Eval-to-RL: engineering/08-eval-to-rl.md
  - 横向比较:
      - Task、Dataset 与 Target: comparisons/01-task-dataset-target.md
      - Runner、并发、缓存与 Retry: comparisons/02-runner-concurrency-cache-retry.md
      - Trace、Artifact 与血缘: comparisons/03-trace-artifact-lineage.md
      - Scorer、Judge 与 Outcome: comparisons/04-scorer-judge-outcomes.md
      - Metric、统计单位与不确定性: comparisons/05-metric-statistics-uncertainty.md
      - Agent Environment 与 Final State: comparisons/06-agent-environment-final-state.md
      - Report、CI 与 Release Gate: comparisons/07-report-ci-release-gate.md
      - 平台适配器边界: comparisons/08-platform-adapters.md
  - 案例:
