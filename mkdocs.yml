  - 实验:
      - 运行一份确定性 Eval: labs/01-run-one-deterministic-eval.md
      - 新增 Target Adapter: labs/02-add-a-target-adapter.md
      - 编写 Scorer: labs/03-write-a-scorer.md
      - 重复运行并比较: labs/04-repeat-and-compare.md
