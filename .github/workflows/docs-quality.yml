name: 文档与参考实现质量

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: python -m pip install uv==0.12.5

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei

      - name: 安装锁定依赖
        run: uv sync --frozen

      - name: 运行完整测试
        run: uv run pytest -q

      - name: 核对仓库发布质量
        run: uv run python scripts/repository_quality.py

      - name: 核对锁定源码来源
        run: uv run python scripts/sources.py verify

      - name: 构建 Reference Harness 包
        run: uv build

      - name: 严格构建中文站点
        run: uv run mkdocs build --strict

      - name: 配置 GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: 上传 GitHub Pages 站点
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
