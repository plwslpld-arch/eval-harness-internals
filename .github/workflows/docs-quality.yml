name: Documentation Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Reference Harness tests
        run: uv run pytest -q

      - name: Build Reference Harness package
        run: uv build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run legacy repository quality gate during migration
        run: npm run check
