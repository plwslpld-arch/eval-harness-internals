version: 1
sources:
  - id: lm-evaluation-harness
    course: lm-evaluation-harness
    repo: EleutherAI/lm-evaluation-harness
    url: https://github.com/EleutherAI/lm-evaluation-harness
    branch: main
    license: MIT
    license_file: LICENSE.md
    redistribution: link-only
    scope:
      - path: lm_eval/evaluator.py
        purpose: 评测入口与主调用链
      - path: lm_eval/api/task.py
        purpose: Task 接口与样本请求构造
      - path: lm_eval/api/model.py
        purpose: Model Adapter 接口
      - path: lm_eval/api/instance.py
        purpose: 请求实例数据结构
      - path: lm_eval/evaluator_utils.py
        purpose: 结果整理与任务输出

  - id: inspect-ai
    course: inspect-ai
    repo: UKGovernmentBEIS/inspect_ai
    url: https://github.com/UKGovernmentBEIS/inspect_ai
    branch: main
    license: MIT
    license_file: LICENSE
    redistribution: link-only
    scope:
      - path: src/inspect_ai/_eval/eval.py
        purpose: Eval 公共入口
      - path: src/inspect_ai/_eval/run.py
        purpose: 运行调度
      - path: src/inspect_ai/_eval/task/run.py
        purpose: 单个 Task 执行链
      - path: src/inspect_ai/scorer/_scorer.py
        purpose: Scorer 抽象与注册
      - path: src/inspect_ai/log/_log.py
        purpose: Eval Log 数据模型

  - id: openai-evals
    course: openai-evals
    repo: openai/evals
    url: https://github.com/openai/evals
    branch: main
    license: MIT
    license_file: LICENSE.md
    redistribution: link-only
    scope:
