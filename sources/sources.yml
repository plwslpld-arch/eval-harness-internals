        purpose: 命令行入口与 Eval Spec 装配
      - path: evals/registry.py
        purpose: Registry 加载与对象解析
      - path: evals/eval.py
        purpose: Eval 与样本执行抽象
      - path: evals/api.py
        purpose: Completion Function 与 API 边界
      - path: evals/record.py
        purpose: 运行事件与记录器

  - id: promptfoo
    course: promptfoo
    repo: promptfoo/promptfoo
    url: https://github.com/promptfoo/promptfoo
    branch: main
    license: MIT
    license_file: LICENSE
    redistribution: link-only
    scope:
      - path: src/evaluator.ts
        purpose: 声明式评测主循环
      - path: src/evaluator/runtime.ts
        purpose: 单测试运行时
      - path: src/providers/index.ts
        purpose: Provider 解析与适配
      - path: src/assertions/index.ts
        purpose: Assertion 分派
      - path: src/types/index.ts
